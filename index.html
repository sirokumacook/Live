<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC Style P2P Broadcast System</title>
    <style>
        /* WRC風のカラーパレットとモダンなUI設定 */
        :root {
            --wrc-navy: #0a192f;
            --wrc-navy-dark: #020c1b;
            --wrc-orange: #ff5722;
            --wrc-orange-hover: #e64a19;
            --text-main: #e6f1ff;
            --panel-bg: rgba(10, 25, 47, 0.85);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--wrc-navy-dark);
            color: var(--text-main);
            overflow: hidden; /* 全画面表示用 */
        }

        /* モード選択画面 */
        #mode-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle, var(--wrc-navy), var(--wrc-navy-dark));
        }

        .mode-btn {
            background-color: transparent;
            color: var(--wrc-orange);
            border: 2px solid var(--wrc-orange);
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
        }

        .mode-btn:hover {
            background-color: var(--wrc-orange);
            color: var(--wrc-navy-dark);
            box-shadow: 0 0 15px var(--wrc-orange);
        }

        /* 放送モードのレイアウト */
        #broadcast-mode {
            display: none;
            height: 100vh;
            width: 100vw;
        }

        /* 左側のコントロールパネル */
        #controls {
            width: 350px;
            height: 100%;
            background-color: var(--wrc-navy);
            border-right: 2px solid var(--wrc-orange);
            padding: 20px;
            overflow-y: auto;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .control-group {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 87, 34, 0.3);
        }

        .control-group h3 {
            color: var(--wrc-orange);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: var(--wrc-navy-dark);
            border: 1px solid #4a5d7e;
            color: white;
            border-radius: 4px;
        }

        button.action-btn {
            width: 100%;
            background-color: var(--wrc-orange);
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--wrc-orange-hover);
        }

        /* 右側の放送プレビュー画面 */
        #preview-area {
            margin-left: 350px;
            height: 100%;
            background-color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* メインメディア（全画面1枚） */
        #main-media-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #main-media-container video, #main-media-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* アスペクト比を維持。画面いっぱいにしたい場合は cover */
        }

        /* 左下のオーバーレイ群（ワイプ、天気、テキスト） */
        #bottom-left-overlays {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            align-items: flex-start;
        }

        /* ワイプ（PiP） */
        #wipe-container {
            width: 320px;
            aspect-ratio: 16/9;
            background-color: #000;
            border: 2px solid var(--wrc-orange);
            display: none; /* 初期非表示 */
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        #wipe-container video, #wipe-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 天気オーバーレイ */
        #weather-overlay {
            background-color: var(--wrc-navy);
            border-left: 4px solid var(--wrc-orange);
            padding: 10px 15px;
            display: none;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        .weather-line { margin: 2px 0; }

        /* テキストオーバーレイ */
        #text-overlay {
            background-color: var(--wrc-navy);
            border-left: 4px solid var(--wrc-orange);
            padding: 10px 15px;
            display: none;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            word-wrap: break-word;
        }

    </style>
</head>
<body>

    <div id="mode-selection">
        <h1 style="color: white; margin-bottom: 40px; font-style: italic;">P2P RALLY BROADCAST</h1>
        <button class="mode-btn" onclick="selectMode('view')">VIEW MODE</button>
        <button class="mode-btn" onclick="selectMode('broadcast')">BROADCAST MODE</button>
    </div>

    <div id="broadcast-mode">
        <div id="controls">
            <h2 style="color: white; border-bottom: 2px solid var(--wrc-orange); padding-bottom: 10px;">CONTROL ROOM</h2>
            
            <div class="control-group">
                <h3>MAIN DISPLAY (FULL SCREEN)</h3>
                <input type="file" id="main-file" accept="video/*,image/*">
                <button class="action-btn" onclick="showMainMedia()">DISPLAY MAIN</button>
            </div>

            <div class="control-group">
                <h3>WIPE DISPLAY (BOTTOM LEFT)</h3>
                <input type="file" id="wipe-file" accept="video/*,image/*">
                <button class="action-btn" onclick="showWipeMedia()">DISPLAY WIPE</button>
                <button class="action-btn" onclick="hideWipeMedia()" style="margin-top: 5px; background: #555;">HIDE WIPE</button>
            </div>

            <div class="control-group">
                <h3>TELEMETRY TEXT</h3>
                <input type="text" id="overlay-text-input" placeholder="Enter broadcast text...">
                <button class="action-btn" onclick="showText()">DISPLAY TEXT</button>
                <button class="action-btn" onclick="hideText()" style="margin-top: 5px; background: #555;">HIDE TEXT</button>
            </div>

            <div class="control-group">
                <h3>WEATHER CONDITION</h3>
                <button class="action-btn" onclick="showWeather()">FETCH & DISPLAY WEATHER</button>
                <button class="action-btn" onclick="hideWeather()" style="margin-top: 5px; background: #555;">HIDE WEATHER</button>
            </div>
            
            <div style="margin-top: 40px;">
                <button class="action-btn" style="background: transparent; border: 1px solid white;" onclick="location.reload()">EXIT BROADCAST</button>
            </div>
        </div>

        <div id="preview-area">
            <div id="main-media-container">
                </div>

            <div id="bottom-left-overlays">
                <div id="wipe-container"></div>
                <div id="weather-overlay">
                    <div class="weather-line" id="weather-cond">COND: --</div>
                    <div class="weather-line" id="weather-temp">TEMP: -- °C</div>
                    <div class="weather-line" id="weather-wind">WIND: -- / -- km/h</div>
                </div>
                <div id="text-overlay"></div>
            </div>
        </div>
    </div>

    <script>
        // モード選択
        function selectMode(mode) {
            document.getElementById('mode-selection').style.display = 'none';
            if (mode === 'broadcast') {
                document.getElementById('broadcast-mode').style.display = 'block';
            } else {
                // 視聴モードの実装（P2P受信側のロジックをここに追加）
                alert('視聴モード: P2P接続の受信待機画面をここに実装します。');
                location.reload(); 
            }
        }

        // ファイルからメディア要素（動画か画像）を生成する共通関数
        function createMediaElement(file, isMuted = true) {
            const fileURL = URL.createObjectURL(file);
            let mediaElement;
            
            if (file.type.startsWith('video/')) {
                mediaElement = document.createElement('video');
                mediaElement.src = fileURL;
                mediaElement.autoplay = true;
                mediaElement.loop = true;
                mediaElement.muted = isMuted; // 放送側は通常ミュート（ハウリング防止）
            } else if (file.type.startsWith('image/')) {
                mediaElement = document.createElement('img');
                mediaElement.src = fileURL;
            }
            return mediaElement;
        }

        // メインメディアの表示（全画面では1枚のみ配置）
        function showMainMedia() {
            const fileInput = document.getElementById('main-file');
            if (!fileInput.files.length) return alert('ファイルを選択してください');

            const container = document.getElementById('main-media-container');
            container.innerHTML = ''; // 既存のメディアを削除（全画面1枚制限）

            const element = createMediaElement(fileInput.files[0], true);
            container.appendChild(element);
        }

        // ワイプメディアの表示（左下）
        function showWipeMedia() {
            const fileInput = document.getElementById('wipe-file');
            if (!fileInput.files.length) return alert('ファイルを選択してください');

            const container = document.getElementById('wipe-container');
            container.innerHTML = ''; // 既存のメディアを削除
            
            const element = createMediaElement(fileInput.files[0], true);
            container.appendChild(element);
            container.style.display = 'block';
        }

        function hideWipeMedia() {
            document.getElementById('wipe-container').style.display = 'none';
            document.getElementById('wipe-container').innerHTML = '';
        }

        // テキストの表示
        function showText() {
            const textInput = document.getElementById('overlay-text-input').value;
            if (!textInput) return;

            const overlay = document.getElementById('text-overlay');
            overlay.innerText = textInput;
            overlay.style.display = 'block';
        }

        function hideText() {
            document.getElementById('text-overlay').style.display = 'none';
        }

        // 風向きを角度から方位に変換
        function getWindDirection(degree) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return directions[Math.round(degree / 45) % 8];
        }

        // 天気コードの簡易変換（WMO Weather interpretation codes）
        function getWeatherCondition(code) {
            if (code === 0) return 'CLEAR';
            if (code >= 1 && code <= 3) return 'CLOUDY';
            if (code >= 45 && code <= 48) return 'FOG';
            if (code >= 51 && code <= 67) return 'RAIN';
            if (code >= 71 && code <= 77) return 'SNOW';
            if (code >= 95) return 'THUNDERSTORM';
            return 'UNKNOWN';
        }

        // 天気の取得と表示
        function showWeather() {
            if (!navigator.geolocation) {
                alert("このブラウザは位置情報に対応していません。");
                return;
            }

            // UIを一時的に更新
            const overlay = document.getElementById('weather-overlay');
            overlay.style.display = 'block';
            document.getElementById('weather-cond').innerText = "FETCHING...";
            document.getElementById('weather-temp').innerText = "TEMP: -- °C";
            document.getElementById('weather-wind').innerText = "WIND: --";

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    // Open-Meteo API（登録不要・無料）を使用して天気を取得
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const data = await response.json();
                    
                    const cw = data.current_weather;
                    
                    const condition = getWeatherCondition(cw.weathercode);
                    const temp = cw.temperature;
                    const windSpeed = cw.windspeed;
                    const windDir = getWindDirection(cw.winddirection);

                    // 3行に分けて表示
                    document.getElementById('weather-cond').innerText = `COND: ${condition}`;
                    document.getElementById('weather-temp').innerText = `TEMP: ${temp} °C`;
                    document.getElementById('weather-wind').innerText = `WIND: ${windDir} / ${windSpeed} km/h`;
                    
                } catch (error) {
                    alert('天気情報の取得に失敗しました。');
                    hideWeather();
                }
            }, (error) => {
                alert('位置情報の取得が許可されませんでした。');
                hideWeather();
            });
        }

        function hideWeather() {
            document.getElementById('weather-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
