<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC P2P Broadcast System</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face { font-family: 'WRCCleanBold'; src: url('./WRCCleanBold.ttf') format('truetype'); }
        :root { --wrc-navy: #0a192f; --wrc-navy-dark: #020c1b; --wrc-orange: #ff5722; --text-main: #e6f1ff; }
        * { box-sizing: border-box; font-family: 'WRCCleanBold', sans-serif; text-transform: uppercase; }
        body { margin: 0; padding: 0; background-color: var(--wrc-navy-dark); color: var(--text-main); overflow: hidden; }

        /* ----- モード選択画面 ----- */
        #mode-selection {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle, var(--wrc-navy), var(--wrc-navy-dark)); 
            position: absolute; top: 0; left: 0; width: 100%; z-index: 9999;
        }
        #version-text { position: absolute; bottom: 15px; right: 25px; color: rgba(255, 255, 255, 0.3); font-size: 14px; letter-spacing: 2px; }
        .btn { 
            background-color: transparent; color: var(--wrc-orange); border: 2px solid var(--wrc-orange); 
            padding: 15px 40px; font-size: 24px; margin: 10px; cursor: pointer; transition: all 0.3s ease; 
        }
        .btn:hover { background-color: var(--wrc-orange); color: var(--wrc-navy-dark); }

        /* ----- サブ画面共通 (視聴 / 外部カメラ) ----- */
        .sub-mode-screen {
            display: none; height: 100vh; width: 100vw; flex-direction: column;
            align-items: center; justify-content: center; background-color: #000; position: absolute; top: 0; left: 0; z-index: 10;
        }
        .ui-panel { z-index: 100; position: absolute; background: var(--wrc-navy); padding: 30px; border: 2px solid var(--wrc-orange); text-align: center; }
        .fullscreen-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        
        #unmute-btn {
            display: none; position: absolute; top: 20px; right: 20px; z-index: 1000;
            padding: 15px 20px; background: var(--wrc-orange); color: #fff; border: none; font-size: 16px; cursor: pointer;
        }
        input[type="text"] { padding: 10px; font-size: 16px; background: var(--wrc-navy-dark); border: 1px solid var(--wrc-orange); color: white; margin-bottom: 15px; width: 100%; text-align: center; letter-spacing: 2px; }
        .status-text { color: yellow; font-size: 14px; margin-top: 10px; }

        /* ----- 放送モード画面 ----- */
        #broadcast-mode { display: none; height: 100vh; flex-direction: column; position: relative; z-index: 10; background: #000; }
        #broadcast-info {
            position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7);
            padding: 10px; font-size: 18px; color: yellow; border: 2px solid yellow; letter-spacing: 2px;
        }

        #preview-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        .scale-area {
            width: 1920px; height: 1080px; position: absolute; top: 50%; left: 50%; 
            transform-origin: center center; transform: translate(-50%, -50%);
        }
        #composite-canvas { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 2; pointer-events: none; }

        #controls {
            background-color: var(--wrc-navy); border-top: 2px solid var(--wrc-orange); padding: 15px; display: flex; gap: 15px; overflow-x: auto; flex-shrink: 0;
        }
        .control-group { background: var(--wrc-navy-dark); border: 1px solid rgba(255, 87, 34, 0.3); padding: 12px; min-width: 250px; display: flex; flex-direction: column; }
        .control-group h3 { color: var(--wrc-orange); margin-top: 0; font-size: 14px; border-bottom: 1px solid var(--wrc-orange); padding-bottom: 5px; margin-bottom: 10px; }
        
        .btn-small { width: 48%; margin: 0; padding: 8px; font-size: 12px; cursor: pointer; border: 1px solid var(--wrc-orange); background: transparent; color: white; transition: 0.2s; }
        .btn-small.active { background: var(--wrc-orange); color: var(--wrc-navy-dark); font-weight: bold; }
        .btn-small:hover { background: rgba(255, 87, 34, 0.3); }
        .flex-row { display: flex; gap: 5px; margin-bottom: 5px; }

        /* ワンタップボタン用のコンテナ */
        .media-btn-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; min-height: 32px; }
        .media-track-btn { flex-grow: 1; padding: 5px; font-size: 12px; border: 1px solid gray; color: gray; background: transparent; cursor: pointer; min-width: 30px; text-align: center; }
        .media-track-btn.active { border-color: var(--wrc-orange); color: var(--wrc-orange); background: rgba(255,87,34,0.1); font-weight: bold; }

        /* 動画フリーズ回避 */
        .hidden-media { position: fixed; top: -9999px; left: -9999px; width: 1280px; height: 720px; z-index: -9999; }
    </style>
</head>
<body>

    <div id="mode-selection">
        <h1 style="font-size: 60px; margin-bottom: 10px; color: white;">P2P RALLY BROADCAST</h1>
        <button class="btn" onclick="initViewer()">VIEWER MODE</button>
        <button class="btn" onclick="initBroadcast()">BROADCAST MODE</button>
        <button class="btn" onclick="initExternalCam()" style="font-size: 18px; border-color: #e91e63; color: #e91e63;">EXTERNAL CAM MODE</button>
        <div id="version-text">VER 11.0.0 (ONE-TAP UI & END BROADCAST)</div>
    </div>

    <div id="viewer-mode" class="sub-mode-screen">
        <div id="viewer-ui" class="ui-panel">
            <h2 style="color: var(--wrc-orange);">CONNECT TO HOST</h2>
            <p style="font-size: 14px;">放送画面左上の4桁の数字を入力</p>
            <input type="text" id="host-id-input" placeholder="0000" maxlength="4" style="font-size: 24px;">
            <br>
            <button class="btn" onclick="connectToHost()">CONNECT</button>
            <div id="viewer-status-text" class="status-text">Ready</div>
        </div>
        <video id="viewer-video" class="fullscreen-video" controls autoplay playsinline muted style="display: none; background: #000; z-index: 2;"></video>
        <button id="unmute-btn" onclick="document.getElementById('viewer-video').muted = false; this.style.display='none';">🔊 UNMUTE AUDIO</button>
    </div>

    <div id="extcam-mode" class="sub-mode-screen">
        <div id="extcam-ui" class="ui-panel" style="border-color: #e91e63;">
            <h2 style="color: #e91e63;">EXTERNAL CAMERA</h2>
            <p style="font-size: 14px;">配信端末のIDを入力して接続</p>
            <input type="text" id="ext-host-id" placeholder="0000" maxlength="4" style="font-size: 24px;">
            <br>
            <button class="btn" onclick="connectExtCam()" style="border-color: #e91e63; color: #e91e63;">CONNECT</button>
            <div id="extcam-status-text" class="status-text">Camera Ready</div>
        </div>
        <video id="extcam-preview" class="fullscreen-video" autoplay playsinline muted style="object-fit: cover;"></video>
    </div>

    <div id="broadcast-mode">
        <div id="broadcast-info">
            ID: <span id="my-peer-id">----</span> | <span id="p2p-status" style="font-size:14px; color:#4CAF50;">LIVE (No viewers)</span>
        </div>

        <div id="preview-wrapper">
            <div class="scale-area" id="host-scale-area">
                <canvas id="composite-canvas" width="1920" height="1080"></canvas>
                <canvas id="stream-canvas" class="hidden-media" width="1920" height="1080"></canvas>
            </div>
        </div>

        <div id="controls">
            <div class="control-group" style="border-color: #f44336; min-width: 180px;">
                <h3 style="color: #f44336; border-color: #f44336;">SYSTEM</h3>
                <button class="btn-small" onclick="endBroadcast()" style="width: 100%; border-color: #f44336; color: #f44336; font-size: 14px; padding: 10px; margin-bottom: 10px; font-weight: bold;">END BROADCAST<br>(配信終了)</button>
                <div class="flex-row">
                    <button id="fps-24-btn" class="btn-small" onclick="setFPS(24)" style="border-color: #4CAF50; color: #4CAF50; width: 50%;">24 FPS</button>
                    <button id="fps-60-btn" class="btn-small" onclick="setFPS(60)" style="border-color: gray; color: gray; width: 50%;">60 FPS</button>
                </div>
                <input type="file" id="logo-file" accept="image/*" onchange="handleLogo()" style="width: 100%; font-size: 10px; margin: 5px 0;">
                <div class="flex-row">
                    <button class="btn-small" onclick="toggleLogo(true)" style="border-color: #e91e63; color: #e91e63;">LOGO ON</button>
                    <button class="btn-small" onclick="toggleLogo(false)" style="border-color: gray; color: gray;">OFF</button>
                </div>
            </div>

            <div class="control-group">
                <h3>MAIN MEDIA</h3>
                <input type="file" id="main-file" accept="video/*,image/*" multiple onchange="handleFiles('main')" style="width: 100%; font-size: 10px; margin-bottom: 5px;">
                <div id="main-btn-list" class="media-btn-list"></div>
            </div>
            
            <div class="control-group">
                <h3>WIPE (LEFT BOTTOM)</h3>
                <input type="file" id="wipe-file" accept="video/*,image/*" multiple onchange="handleFiles('wipe')" style="width: 100%; font-size: 10px; margin-bottom: 5px;">
                <div id="wipe-btn-list" class="media-btn-list"></div>
                <div class="flex-row">
                    <button class="btn-small" onclick="toggleWipe(true)">SHOW WIPE</button>
                    <button class="btn-small" onclick="toggleWipe(false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>TEXT & WEATHER</h3>
                <input type="text" id="overlay-text-input" placeholder="TEXT..." oninput="saveSetting('wrc_text', this.value)" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <div class="flex-row">
                    <button class="btn-small" onclick="activateInfo('text')">TXT ON</button>
                    <button class="btn-small" onclick="activateInfo('weather')">WTH ON</button>
                </div>
                <button class="btn-small" onclick="hideInfo()" style="border-color: gray; color: gray; width: 100%;">HIDE TEXT/WTH</button>
            </div>

            <div class="control-group" style="border-color: #9c27b0;">
                <h3 style="color: #9c27b0; border-color: #9c27b0;">COMING UP NEXT</h3>
                <div class="flex-row">
                    <input type="time" id="schedule-time" oninput="saveSetting('wrc_time', this.value)" style="width: 40%; background: var(--wrc-navy); color: white; border: 1px solid #9c27b0; padding: 5px; font-family: monospace;">
                    <input type="text" id="schedule-text" placeholder="STAGE..." oninput="saveSetting('wrc_stext', this.value)" style="width: 60%; background: var(--wrc-navy); color: white; border: 1px solid #9c27b0; padding: 5px;">
                </div>
                <div class="flex-row">
                    <button class="btn-small" onclick="toggleSchedule(true)" style="border-color: #9c27b0; color: #9c27b0;">SHOW</button>
                    <button class="btn-small" onclick="toggleSchedule(false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>

            <div class="control-group" style="border-color: #2196F3;">
                <h3 style="color: #2196F3; border-color: #2196F3;">BGM (AUTO DJ)</h3>
                <input type="file" id="bgm-file" accept="audio/*, .mp3, .wav, .m4a" multiple onchange="handleAudioFiles()" style="width: 100%; font-size: 10px; margin-bottom: 5px;">
                <div id="bgm-btn-list" class="media-btn-list"></div>
                <div class="flex-row">
                    <button class="btn-small" onclick="playBgmRandom()" style="border-color: #2196F3; color: #2196F3; width: 100%;">🎲 RANDOM NEXT</button>
                </div>
                <button class="btn-small" onclick="stopBgm()" style="border-color: gray; color: gray; width: 100%; margin-top: 5px;">STOP ALL</button>
            </div>
        </div>

        <div id="media-pool">
            <video id="main-video" class="hidden-media" loop playsinline></video>
            <img id="main-img" class="hidden-media">
            <video id="wipe-video" class="hidden-media" loop playsinline></video>
            <img id="wipe-img" class="hidden-media">
            <audio id="bgm-player" class="hidden-media"></audio>
            <video id="ext-cam-video" class="hidden-media" autoplay playsinline muted></video>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. ローカルデータベース構築 (バグ耐性強化版)
        // ==========================================
        const dbName = "WrcBroadcastDB5";
        let db;
        let viewerConns = [];

        function initDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(dbName, 1);
                req.onupgradeneeded = e => {
                    db = e.target.result;
                    if(!db.objectStoreNames.contains('files')) db.createObjectStore('files');
                };
                req.onsuccess = e => { db = e.target.result; resolve(); };
                req.onerror = e => { console.warn("IndexedDB Error", e); resolve(); }; // エラーでも止めない
            });
        }

        function saveFilesToDB(key, files) {
            if(!db) return;
            try {
                const tx = db.transaction('files', 'readwrite');
                tx.objectStore('files').put(files, key);
            } catch(e) { console.warn("Failed to save files to DB. Device might not support it.", e); }
        }

        function loadFilesFromDB(key) {
            return new Promise(resolve => {
                if(!db) return resolve([]);
                try {
                    const tx = db.transaction('files', 'readonly');
                    const req = tx.objectStore('files').get(key);
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                } catch(e) { resolve([]); }
            });
        }

        function saveSetting(key, value) { localStorage.setItem(key, value); }
        function loadSetting(key, defaultVal) { return localStorage.getItem(key) || defaultVal; }

        window.onload = async () => {
            try {
                await initDB();
                const mFiles = await loadFilesFromDB('main'); if(mFiles.length > 0) { mainFiles = mFiles; populateButtons('main', mainFiles); }
                const wFiles = await loadFilesFromDB('wipe'); if(wFiles.length > 0) { wipeFiles = wFiles; populateButtons('wipe', wipeFiles); }
                const bFiles = await loadFilesFromDB('bgm');  if(bFiles.length > 0) { bgmFiles = bFiles; populateButtons('bgm', bgmFiles); }
                const lFile = await loadFilesFromDB('logo');  if(lFile.length > 0) { logoFile = lFile[0]; logoImg.src = URL.createObjectURL(logoFile); logoState = true; }

                document.getElementById('overlay-text-input').value = loadSetting('wrc_text', '');
                document.getElementById('schedule-time').value = loadSetting('wrc_time', '12:00');
                document.getElementById('schedule-text').value = loadSetting('wrc_stext', 'STAGE 1');
                
                targetFPS = parseInt(loadSetting('wrc_fps', '24'));
                setFPS(targetFPS);

                // Auto DJ 連鎖再生
                document.getElementById('bgm-player').addEventListener('ended', () => { playBgmRandom(); });
            } catch(e) {}
        };

        function resizePreview() {
            const wrapper = document.getElementById('preview-wrapper');
            if(!wrapper || wrapper.style.display === 'none') return;
            const scaleArea = wrapper.querySelector('.scale-area');
            if(scaleArea) {
                const scale = Math.min(wrapper.clientWidth / 1920, wrapper.clientHeight / 1080);
                scaleArea.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }
        }
        window.addEventListener('resize', resizePreview);

        // ==========================================
        // 1. 天気取得システム
        // ==========================================
        let weatherData = { cond: '--', temp: '--', wind: '-- / --' };
        function fetchWeatherInBackground() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`);
                    const cw = (await res.json()).current_weather;
                    const c = cw.weathercode;
                    let condStr = 'STORM';
                    if(c===0) condStr='CLEAR'; else if(c<=3) condStr='CLOUDY'; else if(c<=48) condStr='FOG'; else if(c<=67) condStr='RAIN'; else if(c<=77) condStr='SNOW';
                    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
                    const dir = dirs[Math.round(cw.winddirection/45)%8];
                    weatherData = { cond: condStr, temp: `${cw.temperature} °C`, wind: `${dir} / ${cw.windspeed} km/h` };
                } catch(e) {}
            }, () => {}, { timeout: 10000 });
        }
        setInterval(fetchWeatherInBackground, 60000);

        // ==========================================
        // 2. ワンタップメディア制御エンジン
        // ==========================================
        let mainFiles = [], wipeFiles = [], bgmFiles = [];
        let isMainVideo = false, isWipeVideo = false;

        function resumeAudio() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }

        // 新機能：ワンタップボタンの生成
        function populateButtons(type, files) {
            const container = document.getElementById(`${type}-btn-list`);
            container.innerHTML = '';
            
            // 外部カメラが接続されていればボタン追加
            if ((type === 'main' || type === 'wipe') && extCamConnected) {
                const btn = document.createElement('button');
                btn.className = `media-track-btn`;
                btn.innerText = '📱 CAM';
                btn.style.color = '#e91e63';
                btn.style.borderColor = '#e91e63';
                btn.onclick = () => {
                    if(type === 'main') switchMainMedia('ext-cam', btn);
                    if(type === 'wipe') switchWipeMedia('ext-cam', btn);
                };
                container.appendChild(btn);
            }

            files.forEach((f, i) => {
                const btn = document.createElement('button');
                btn.className = `media-track-btn`;
                btn.innerText = (i + 1).toString(); // シンプルに番号表示
                btn.title = f.name; // ホバーでファイル名
                btn.onclick = () => {
                    if(type === 'main') switchMainMedia(i, btn);
                    if(type === 'wipe') switchWipeMedia(i, btn);
                    if(type === 'bgm') playBgm(i, btn);
                };
                container.appendChild(btn);
            });

            // 自動的に1番目を選択して再生
            if (files.length > 0) {
                const firstBtn = container.querySelectorAll('.media-track-btn')[extCamConnected ? 1 : 0];
                if(type === 'main') switchMainMedia(0, firstBtn);
                if(type === 'wipe') switchWipeMedia(0, firstBtn);
            }
        }

        let extCamConnected = false;
        function addExternalCamOption() {
            extCamConnected = true;
            populateButtons('main', mainFiles);
            populateButtons('wipe', wipeFiles);
        }

        // ファイルを選択した直後にアップロード＆ボタン生成
        function handleFiles(type) {
            const input = document.getElementById(`${type}-file`);
            const files = Array.from(input.files);
            if(files.length === 0) return;
            if(type === 'main') { mainFiles = files; saveFilesToDB('main', files); populateButtons('main', files); }
            if(type === 'wipe') { wipeFiles = files; saveFilesToDB('wipe', files); populateButtons('wipe', files); toggleWipe(true); }
        }

        function handleAudioFiles() {
            const input = document.getElementById('bgm-file');
            const files = Array.from(input.files);
            if(files.length === 0) return;
            bgmFiles = files; saveFilesToDB('bgm', files); populateButtons('bgm', files);
        }

        // アクティブなボタンのハイライトを更新
        function updateActiveButton(containerId, activeBtn) {
            document.querySelectorAll(`#${containerId} .media-track-btn`).forEach(b => b.classList.remove('active'));
            if(activeBtn) activeBtn.classList.add('active');
        }

        function switchMainMedia(idxOrType, btnElement = null) {
            resumeAudio();
            updateActiveButton('main-btn-list', btnElement);

            if(idxOrType === "ext-cam") { isMainVideo = 'ext-cam'; return; }
            
            const file = mainFiles[idxOrType];
            if(!file) return;
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                isMainVideo = true; const v = document.getElementById('main-video'); 
                v.src = url; v.play().catch(()=>{});
            } else { isMainVideo = false; document.getElementById('main-img').src = url; }
        }

        function switchWipeMedia(idxOrType, btnElement = null) {
            resumeAudio();
            updateActiveButton('wipe-btn-list', btnElement);

            if(idxOrType === "ext-cam") { isWipeVideo = 'ext-cam'; toggleWipe(true); return; }

            const file = wipeFiles[idxOrType];
            if(!file) return;
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                isWipeVideo = true; const v = document.getElementById('wipe-video'); 
                v.src = url; v.play().catch(()=>{});
            } else { isWipeVideo = false; document.getElementById('wipe-img').src = url; }
            toggleWipe(true);
        }

        function playBgm(idx, btnElement = null) {
            resumeAudio();
            if (bgmFiles.length === 0) return;
            
            // ボタンが直接指定されていない場合（AutoDJ）、UIのインデックスを探してハイライト
            if(!btnElement) {
                const btns = document.querySelectorAll(`#bgm-btn-list .media-track-btn`);
                if(btns[idx]) btnElement = btns[idx];
            }
            updateActiveButton('bgm-btn-list', btnElement);

            const player = document.getElementById('bgm-player');
            player.src = URL.createObjectURL(bgmFiles[idx]);
            player.play().catch(()=>{});
        }

        function playBgmRandom() {
            if (bgmFiles.length === 0) return;
            const rIndex = Math.floor(Math.random() * bgmFiles.length);
            playBgm(rIndex);
        }

        function stopBgm() { 
            const p = document.getElementById('bgm-player'); p.pause(); 
            updateActiveButton('bgm-btn-list', null);
        }

        let targetFPS = 24;
        function setFPS(fps) {
            targetFPS = fps; saveSetting('wrc_fps', fps);
            if(fps === 24) {
                document.getElementById('fps-24-btn').style.borderColor = '#4CAF50'; document.getElementById('fps-24-btn').style.color = '#4CAF50';
                document.getElementById('fps-60-btn').style.borderColor = 'gray'; document.getElementById('fps-60-btn').style.color = 'gray';
            } else {
                document.getElementById('fps-60-btn').style.borderColor = '#4CAF50'; document.getElementById('fps-60-btn').style.color = '#4CAF50';
                document.getElementById('fps-24-btn').style.borderColor = 'gray'; document.getElementById('fps-24-btn').style.color = 'gray';
            }
        }

        let logoFile = null, logoImg = new Image(), logoState = false;
        function handleLogo() {
            const input = document.getElementById('logo-file');
            if(input.files.length > 0) {
                logoFile = input.files[0]; logoImg.src = URL.createObjectURL(logoFile);
                saveFilesToDB('logo', [logoFile]); logoState = true;
            }
        }
        function toggleLogo(show) { logoState = show; }

        // ==========================================
        // 3. 配信終了機能 (END BROADCAST)
        // ==========================================
        function endBroadcast() {
            const confirmEnd = confirm("本当に配信を終了し、視聴者をホーム画面に戻しますか？");
            if (!confirmEnd) return;

            // 視聴者に終了シグナルを送信
            viewerConns.forEach(conn => {
                if(conn.open) conn.send({ type: 'END_BROADCAST' });
            });

            // 自身もリロードして完全リセット
            setTimeout(() => {
                location.reload();
            }, 500);
        }


        // ==========================================
        // 4. キャンバス描画エンジン
        // ==========================================
        const compositeCanvas = document.getElementById('composite-canvas');
        const compCtx = compositeCanvas.getContext('2d');
        const streamCanvas = document.getElementById('stream-canvas');
        const streamCtx = streamCanvas.getContext('2d');

        let wipeState = { status: 'HIDDEN', progress: 0 };
        let infoState = { active: null, next: null, status: 'HIDDEN', progress: 0 }; 
        let scheduleState = { status: 'HIDDEN', progress: 0, time: '', text: '' };

        function toggleWipe(show) {
            if(show && wipeState.status === 'HIDDEN') { wipeState.status = 'IN'; wipeState.progress = 0; }
            else if(!show && wipeState.status === 'VISIBLE') { wipeState.status = 'OUT'; wipeState.progress = 1; }
        }
        function activateInfo(type) {
            if(infoState.status === 'HIDDEN') { infoState.active = type; infoState.status = 'IN'; infoState.progress = 0; } 
            else if(infoState.status === 'VISIBLE' && infoState.active !== type) { infoState.next = type; infoState.status = 'OUT'; infoState.progress = 1.0; }
        }
        function hideInfo() { if(infoState.status === 'VISIBLE') { infoState.next = null; infoState.status = 'OUT'; infoState.progress = 1.0; } }
        function toggleSchedule(show) {
            if(show && scheduleState.status === 'HIDDEN') {
                scheduleState.time = document.getElementById('schedule-time').value || "00:00";
                scheduleState.text = document.getElementById('schedule-text').value || "NEXT STAGE";
                scheduleState.status = 'IN'; scheduleState.progress = 0;
            } else if(!show && scheduleState.status === 'VISIBLE') { scheduleState.status = 'OUT'; scheduleState.progress = 1; }
        }

        function drawImageCover(ctx, img, x, y, w, h) {
            const imgW = img.videoWidth || img.naturalWidth || img.width; 
            const imgH = img.videoHeight || img.naturalHeight || img.height;
            if(!imgW || !imgH) return;
            const ratio = Math.max(w / imgW, h / imgH);
            const drawW = imgW * ratio, drawH = imgH * ratio;
            const offsetX = x + (w - drawW) / 2, offsetY = y + (h - drawH) / 2;
            ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
            ctx.drawImage(img, offsetX, offsetY, drawW, drawH); ctx.restore();
        }

        let lastUpdate = performance.now();
        let lastStreamDrawTime = 0;

        function renderLoop(time) {
            requestAnimationFrame(renderLoop);
            const dt = (time - lastUpdate) / 1000;
            lastUpdate = time;

            compCtx.fillStyle = '#000'; compCtx.fillRect(0, 0, 1920, 1080);
            let mainMedia;
            if (isMainVideo === 'ext-cam') mainMedia = document.getElementById('ext-cam-video');
            else mainMedia = isMainVideo ? document.getElementById('main-video') : document.getElementById('main-img');
            drawImageCover(compCtx, mainMedia, 0, 0, 1920, 1080);

            if(logoState && logoImg.src && logoImg.width) {
                const logoH = 100; const logoW = logoImg.width * (logoH / logoImg.height);
                compCtx.drawImage(logoImg, 1920 - logoW - 50, 50, logoW, logoH);
            }

            const animSpeed = 2.5;
            const fixedX = 50, fixedY = 800;

            if (wipeState.status !== 'HIDDEN') {
                if(wipeState.status === 'IN') { wipeState.progress += dt*animSpeed; if(wipeState.progress>=1){wipeState.progress=1; wipeState.status='VISIBLE';} }
                else if(wipeState.status === 'OUT') { wipeState.progress -= dt*animSpeed; if(wipeState.progress<=0){wipeState.status='HIDDEN';} }
                
                const ww = 480, wh = 270;
                const blockX = fixedX - ww + (ww * 2) * wipeState.progress;
                compCtx.save(); compCtx.beginPath(); compCtx.rect(fixedX, fixedY, ww, wh); compCtx.clip();
                
                if(wipeState.progress > 0.5 || wipeState.status === 'VISIBLE') {
                    let wipeMedia;
                    if (isWipeVideo === 'ext-cam') wipeMedia = document.getElementById('ext-cam-video');
                    else wipeMedia = isWipeVideo ? document.getElementById('wipe-video') : document.getElementById('wipe-img');
                    drawImageCover(compCtx, wipeMedia, fixedX, fixedY, ww, wh);
                    compCtx.strokeStyle = '#ff5722'; compCtx.lineWidth = 8; compCtx.strokeRect(fixedX, fixedY, ww, wh);
                }
                if(wipeState.status === 'IN' || wipeState.status === 'OUT') { compCtx.fillStyle = '#ff5722'; compCtx.fillRect(blockX, fixedY, ww, wh); }
                compCtx.restore();
            }

            if (infoState.status !== 'HIDDEN') {
                if(infoState.status === 'IN') { infoState.progress += dt*animSpeed; if(infoState.progress>=1){infoState.progress=1; infoState.status='VISIBLE';} }
                else if(infoState.status === 'OUT') { 
                    infoState.progress -= dt*animSpeed; 
                    if(infoState.progress<=0) {
                        if(infoState.next){ infoState.active = infoState.next; infoState.next = null; infoState.status = 'IN'; infoState.progress = 0; }
                        else { infoState.status = 'HIDDEN'; }
                    }
                }
                
                let iw = 480, ih = 100;
                let textStr = "";
                if(infoState.active === 'text') {
                    textStr = document.getElementById('overlay-text-input').value || " ";
                    compCtx.font = "48px WRCCleanBold"; iw = Math.min(compCtx.measureText(textStr).width + 60, 1000); ih = 100;
                } else if(infoState.active === 'weather') { iw = 450; ih = 180; }

                const blockX = fixedX - iw + (iw * 2) * infoState.progress;
                compCtx.save(); compCtx.beginPath(); compCtx.rect(fixedX, fixedY, iw, ih); compCtx.clip();
                if(infoState.progress > 0.5 || infoState.status === 'VISIBLE') {
                    compCtx.fillStyle = 'rgba(10, 25, 47, 0.95)'; compCtx.fillRect(fixedX, fixedY, iw, ih);
                    compCtx.fillStyle = '#ff5722'; compCtx.fillRect(fixedX, fixedY, 10, ih); 
                    compCtx.fillStyle = '#fff'; compCtx.textAlign = 'left'; compCtx.textBaseline = 'top';
                    if(infoState.active === 'text') {
                        compCtx.font = "48px WRCCleanBold"; compCtx.fillText(textStr, fixedX + 30, fixedY + 25);
                    } else {
                        compCtx.fillStyle = '#ff5722'; compCtx.font = "24px WRCCleanBold"; compCtx.fillText("WEATHER CONDITION", fixedX + 30, fixedY + 20);
                        compCtx.fillStyle = 'rgba(255,255,255,0.2)'; compCtx.fillRect(fixedX + 30, fixedY + 55, iw - 50, 2);
                        compCtx.fillStyle = '#fff'; compCtx.font = "32px WRCCleanBold";
                        compCtx.fillText(`COND: ${weatherData.cond}`, fixedX + 30, fixedY + 70);
                        compCtx.fillText(`TEMP: ${weatherData.temp}`, fixedX + 30, fixedY + 105);
                        compCtx.fillText(`WIND: ${weatherData.wind}`, fixedX + 30, fixedY + 140);
                    }
                }
                if(infoState.status === 'IN' || infoState.status === 'OUT') { compCtx.fillStyle = '#ff5722'; compCtx.fillRect(blockX, fixedY, iw, ih); }
                compCtx.restore();
            }

            if (scheduleState.status !== 'HIDDEN') {
                if(scheduleState.status === 'IN') { scheduleState.progress += dt*animSpeed; if(scheduleState.progress>=1){scheduleState.progress=1; scheduleState.status='VISIBLE';} }
                else if(scheduleState.status === 'OUT') { scheduleState.progress -= dt*animSpeed; if(scheduleState.progress<=0){scheduleState.status='HIDDEN';} }

                const sw = 1250, sh = 130;
                const sx = (1920 - sw) / 2;
                const sy = 1080 - sh; 
                const blockX = sx - sw + (sw * 2) * scheduleState.progress;

                const now = new Date();
                let targetH = 0, targetM = 0;
                if (scheduleState.time) {
                    const parts = scheduleState.time.split(':');
                    targetH = parseInt(parts[0], 10);
                    targetM = parseInt(parts[1], 10);
                }
                let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), targetH, targetM, 0);
                let diff = targetDate - now;
                if (diff < 0) diff = 0; 
                const diffSec = Math.floor(diff / 1000);
                const hh = String(Math.floor(diffSec / 3600)).padStart(2, '0');
                const mm = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
                const ss = String(diffSec % 60).padStart(2, '0');
                const countdownStr = `${hh}:${mm}:${ss}`;

                compCtx.save(); compCtx.beginPath(); compCtx.rect(sx, sy, sw, sh); compCtx.clip();
                if(scheduleState.progress > 0.5 || scheduleState.status === 'VISIBLE') {
                    compCtx.fillStyle = 'rgba(10, 25, 47, 0.95)'; compCtx.fillRect(sx, sy, sw, sh);
                    compCtx.fillStyle = '#ff5722'; compCtx.fillRect(sx, sy, sw, 6);

                    compCtx.fillStyle = '#fff'; compCtx.font = "90px WRCCleanBold";
                    compCtx.textAlign = 'left'; compCtx.textBaseline = 'middle';
                    compCtx.fillText(countdownStr, sx + 50, sy + (sh / 2) + 5);

                    compCtx.fillStyle = 'rgba(255,255,255,0.3)';
                    compCtx.fillRect(sx + 480, sy + 25, 2, sh - 50);

                    compCtx.fillStyle = '#ff5722'; compCtx.font = "26px WRCCleanBold"; 
                    compCtx.textAlign = 'left'; compCtx.textBaseline = 'top';
                    compCtx.fillText("COMING UP NEXT", sx + 510, sy + 30);

                    compCtx.font = "40px WRCCleanBold";
                    compCtx.fillText("LOCAL", sx + 510, sy + 70);
                    const localWidth = compCtx.measureText("LOCAL ").width;
                    
                    compCtx.fillStyle = '#fff';
                    compCtx.fillText(`${scheduleState.time || "00:00"}   ${scheduleState.text}`, sx + 510 + localWidth, sy + 70);
                }
                if(scheduleState.status === 'IN' || scheduleState.status === 'OUT') { compCtx.fillStyle = '#ff5722'; compCtx.fillRect(blockX, sy, sw, sh); }
                compCtx.restore();
            }

            const elapsedStream = time - lastStreamDrawTime;
            if (elapsedStream >= (1000 / targetFPS)) {
                lastStreamDrawTime = time - (elapsedStream % (1000 / targetFPS));
                streamCtx.clearRect(0,0,1920,1080);
                streamCtx.drawImage(compositeCanvas, 0, 0);
            }
        }

        // ==========================================
        // 5. P2P WebRTC & Audio Mixer
        // ==========================================
        let peer = null;
        let mixedStream = null;
        let audioCtx = null;

        function initAudioMixer() {
            try {
                if(audioCtx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                const dest = audioCtx.createMediaStreamDestination();

                const mainVideo = document.getElementById('main-video');
                const wipeVideo = document.getElementById('wipe-video');
                const bgmPlayer = document.getElementById('bgm-player');
                const extCamVideo = document.getElementById('ext-cam-video');
                
                [mainVideo, bgmPlayer, wipeVideo, extCamVideo].forEach(media => {
                    const src = audioCtx.createMediaElementSource(media);
                    src.connect(dest);
                });

                return dest.stream.getAudioTracks()[0];
            } catch(e) { return null; }
        }

        async function initBroadcast() {
            try {
                if (typeof Peer === 'undefined') return alert("通信エラー。リロードしてください。");
                
                streamCtx.fillStyle = '#000'; streamCtx.fillRect(0, 0, 1920, 1080);
                compCtx.fillStyle = '#000'; compCtx.fillRect(0, 0, 1920, 1080);

                const captureFunc = streamCanvas.captureStream || streamCanvas.mozCaptureStream;
                if (!captureFunc) return alert("お使いのブラウザは映像配信に非対応です。");

                fetchWeatherInBackground();
                document.getElementById('mode-selection').style.display = 'none';
                document.getElementById('broadcast-mode').style.display = 'flex';
                resizePreview();
                
                const audioTrack = initAudioMixer();

                const canvasStream = captureFunc.call(streamCanvas, 60); 
                const videoTrack = canvasStream.getVideoTracks()[0];
                
                const tracks = [videoTrack, audioTrack].filter(t => t);
                mixedStream = new MediaStream(tracks);

                const displayId = Math.floor(1000 + Math.random() * 9000).toString();
                const secureHostId = "wrc-broadcast-pro-" + displayId; 

                peer = new Peer(secureHostId);
                peer.on('open', () => { document.getElementById('my-peer-id').innerText = displayId; });

                peer.on('call', (call) => {
                    if (call.metadata && call.metadata.type === 'ext-cam') {
                        call.answer(); 
                        call.on('stream', (remoteStream) => {
                            const extVideo = document.getElementById('ext-cam-video');
                            extVideo.srcObject = remoteStream;
                            extVideo.play();
                            addExternalCamOption();
                            alert("📱 EXTERNAL CAMERA CONNECTED!");
                        });
                    }
                });

                peer.on('connection', (conn) => {
                    viewerConns.push(conn);
                    conn.on('data', (data) => {
                        if (data && data.type === 'HELLO_HOST') {
                            document.getElementById('p2p-status').innerText = "Viewer Connected!";
                            document.getElementById('p2p-status').style.color = "yellow";
                            peer.call(data.viewerId, mixedStream);
                        }
                    });
                    conn.on('close', () => { viewerConns = viewerConns.filter(c => c !== conn); });
                });

                requestAnimationFrame(renderLoop);
            } catch (err) { alert("起動エラーが発生しました: " + err.message); }
        }

        function initViewer() {
            try {
                if (typeof Peer === 'undefined') return alert("通信エラー。リロードしてください。");
                document.getElementById('mode-selection').style.display = 'none';
                document.getElementById('viewer-mode').style.display = 'flex';
                
                peer = new Peer();
                peer.on('open', () => { document.getElementById('viewer-status-text').innerText = "System Ready."; });
                
                peer.on('call', (call) => {
                    document.getElementById('viewer-status-text').innerText = "Receiving P2P Stream...";
                    call.answer();
                    call.on('stream', (remoteStream) => {
                        document.getElementById('viewer-ui').style.display = 'none';
                        const video = document.getElementById('viewer-video');
                        video.style.display = 'block';
                        video.srcObject = remoteStream;
                        document.getElementById('unmute-btn').style.display = 'block';
                    });
                });
            } catch (err) { alert("起動エラーが発生しました: " + err.message); }
        }

        function connectToHost() {
            const inputId = document.getElementById('host-id-input').value.trim();
            if (!inputId || inputId.length !== 4) return alert("4桁のIDを入力してください");
            
            const targetHostId = "wrc-broadcast-pro-" + inputId;
            document.getElementById('viewer-status-text').innerText = "Connecting...";
            const conn = peer.connect(targetHostId, { reliable: true });
            
            conn.on('open', () => { conn.send({ type: 'HELLO_HOST', viewerId: peer.id }); });
            
            // 配信終了の受信
            conn.on('data', (data) => {
                if(data && data.type === 'END_BROADCAST') {
                    alert("ホストが配信を終了しました");
                    location.reload();
                }
            });
            conn.on('error', () => { alert("接続エラー"); });
        }

        // ==========================================
        // 6. EXTERNAL CAMERA
        // ==========================================
        let extCamStream = null;
        async function initExternalCam() {
            try {
                document.getElementById('mode-selection').style.display = 'none';
                document.getElementById('extcam-mode').style.display = 'flex';
                
                extCamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: true });
                document.getElementById('extcam-preview').srcObject = extCamStream;
                
                peer = new Peer();
                peer.on('open', () => { document.getElementById('extcam-status-text').innerText = "Camera Ready. Enter HOST ID."; });
            } catch(e) { alert("カメラの起動に失敗しました。権限を許可してください。"); }
        }

        function connectExtCam() {
            const inputId = document.getElementById('ext-host-id').value.trim();
            if (!inputId || inputId.length !== 4) return alert("配信端末の4桁IDを入力してください");
            
            const targetHostId = "wrc-broadcast-pro-" + inputId;
            document.getElementById('extcam-status-text').innerText = "Connecting to Host...";
            
            const call = peer.call(targetHostId, extCamStream, { metadata: { type: 'ext-cam' } });
            call.on('stream', () => {}); 
            
            document.getElementById('extcam-ui').style.display = 'none';
        }
    </script>
