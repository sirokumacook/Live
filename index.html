<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC P2P Broadcast System</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'WRCCleanBold';
            src: url('./WRCCleanBold.ttf') format('truetype');
        }

        :root {
            --wrc-navy: #0a192f;
            --wrc-navy-dark: #020c1b;
            --wrc-orange: #ff5722;
            --text-main: #e6f1ff;
        }

        * { box-sizing: border-box; font-family: 'WRCCleanBold', sans-serif; text-transform: uppercase; }
        body { margin: 0; padding: 0; background-color: var(--wrc-navy-dark); color: var(--text-main); overflow: hidden; }

        /* ----- モード選択画面 ----- */
        #mode-selection {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle, var(--wrc-navy), var(--wrc-navy-dark)); position: relative;
        }
        #version-text { position: absolute; bottom: 15px; right: 25px; color: rgba(255, 255, 255, 0.3); font-size: 14px; letter-spacing: 2px; }
        
        .btn {
            background-color: transparent; color: var(--wrc-orange); border: 2px solid var(--wrc-orange);
            padding: 15px 40px; font-size: 24px; margin: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        .btn:hover { background-color: var(--wrc-orange); color: var(--wrc-navy-dark); }

        /* ----- 視聴モード画面 ----- */
        #viewer-mode {
            display: none; height: 100vh; width: 100vw; flex-direction: column;
            align-items: center; justify-content: center; background-color: #000;
        }
        #viewer-ui {
            z-index: 100; position: absolute; background: var(--wrc-navy); padding: 30px; border: 2px solid var(--wrc-orange); text-align: center;
        }
        #viewer-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
        input[type="text"] {
            padding: 10px; font-size: 24px; background: var(--wrc-navy-dark); border: 1px solid var(--wrc-orange); color: white; margin-bottom: 15px; width: 200px; text-align: center; letter-spacing: 5px;
        }
        #viewer-status-text { color: yellow; font-size: 14px; margin-top: 10px; }

        /* ----- 放送モード画面 ----- */
        #broadcast-mode { display: none; height: 100vh; flex-direction: column; }
        #broadcast-info {
            position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7);
            padding: 10px; font-size: 18px; color: yellow; border: 2px solid yellow; letter-spacing: 2px;
        }

        #preview-wrapper { flex: 1; background-color: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        /* 画面共有を使わず、このCanvasを映像ストリームに変換してP2Pで送ります */
        #composite-canvas {
            background-color: #111;
            /* ウィンドウサイズに合わせて自動縮小 */
            max-width: 100%; max-height: 100%;
            object-fit: contain;
        }

        #controls {
            background-color: var(--wrc-navy); border-top: 2px solid var(--wrc-orange); padding: 15px; display: flex; gap: 15px; overflow-x: auto; flex-shrink: 0;
        }
        .control-group { background: var(--wrc-navy-dark); border: 1px solid rgba(255, 87, 34, 0.3); padding: 12px; min-width: 250px; }
        .control-group h3 { color: var(--wrc-orange); margin-top: 0; font-size: 14px; border-bottom: 1px solid var(--wrc-orange); padding-bottom: 5px; margin-bottom: 10px; }
        select.file-select { width: 100%; padding: 5px; margin-bottom: 10px; background: var(--wrc-navy); color: white; border: 1px solid var(--wrc-orange); font-family: monospace; }
        .btn-small { width: 48%; margin: 0; padding: 8px; font-size: 12px; }

        /* 内部処理用（非表示） */
        .hidden-media { display: none; }
    </style>
</head>
<body>

    <div id="mode-selection">
        <h1 style="font-size: 60px; margin-bottom: 10px; color: white;">P2P RALLY BROADCAST</h1>
        <button class="btn" onclick="initViewer()">VIEWER MODE</button>
        <button class="btn" onclick="initBroadcast()">BROADCAST MODE</button>
        <div id="version-text">VER 2.0.0 (CANVAS ENGINE)</div>
    </div>

    <div id="viewer-mode">
        <div id="viewer-ui">
            <h2 style="color: var(--wrc-orange);">CONNECT TO HOST</h2>
            <p style="font-size: 14px;">放送画面左上の4桁の数字を入力</p>
            <input type="text" id="host-id-input" placeholder="0000" maxlength="4">
            <br>
            <button class="btn" onclick="connectToHost()">CONNECT</button>
            <div id="viewer-status-text">Ready</div>
        </div>
        <video id="viewer-video" autoplay playsinline></video>
    </div>

    <div id="broadcast-mode">
        <div id="broadcast-info">
            ID: <span id="my-peer-id">----</span> | <span id="p2p-status" style="font-size:14px; color:#4CAF50;">LIVE (No viewers)</span>
        </div>

        <div id="preview-wrapper">
            <canvas id="composite-canvas" width="1920" height="1080"></canvas>
        </div>

        <div id="controls">
            <div class="control-group">
                <h3>MAIN MEDIA</h3>
                <input type="file" id="main-file" accept="video/*,image/*" multiple onchange="handleFiles('main')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="main-file-select" class="file-select" onchange="switchMainMedia()"><option value="">Select File...</option></select>
            </div>
            
            <div class="control-group">
                <h3>OVERLAYS (LEFT BOTTOM)</h3>
                <input type="file" id="wipe-file" accept="video/*,image/*" multiple onchange="handleFiles('wipe')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="wipe-file-select" class="file-select" onchange="if(this.value!=='') activateOverlay('wipe')"><option value="">Wipe File...</option></select>
                
                <input type="text" id="overlay-text-input" placeholder="TEXT..." style="width: 100%; font-size: 14px; margin-bottom: 5px;">
                <div style="margin-bottom: 5px;">
                    <button class="btn btn-small" onclick="activateOverlay('text')">TXT ON</button>
                    <button class="btn btn-small" onclick="activateOverlay('weather')">WTH ON</button>
                </div>
                <div><button class="btn btn-small" onclick="hideOverlays()" style="border-color: gray; color: gray; width: 100%;">HIDE ALL OVERLAYS</button></div>
            </div>

            <div class="control-group" style="border-color: #ff9800;">
                <h3 style="color: #ff9800;">SPEED METER (RIGHT)</h3>
                <div style="margin-top: 10px;">
                    <button class="btn btn-small" onclick="toggleSpeed(true)" style="border-color: #ff9800; color: #ff9800;">ON</button>
                    <button class="btn btn-small" onclick="toggleSpeed(false)" style="border-color: gray; color: gray;">OFF</button>
                </div>
            </div>

            <div class="control-group" style="border-color: #2196F3;">
                <h3 style="color: #2196F3;">BGM AUDIO</h3>
                <input type="file" id="bgm-file" accept="audio/*, .mp3, .wav, .m4a" multiple onchange="handleAudioFiles()" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="bgm-select" class="file-select"><option value="">Select Audio...</option></select>
                <div>
                    <button class="btn btn-small" onclick="playBgm()" style="border-color: #2196F3; color: #2196F3;">PLAY</button>
                    <button class="btn btn-small" onclick="stopBgm()" style="border-color: gray; color: gray;">STOP</button>
                </div>
            </div>
        </div>

        <video id="main-video" class="hidden-media" autoplay loop playsinline></video>
        <img id="main-img" class="hidden-media">
        <video id="wipe-video" class="hidden-media" autoplay loop playsinline muted></video>
        <img id="wipe-img" class="hidden-media">
        <audio id="bgm-player" class="hidden-media" loop></audio>
    </div>

    <script>
        // ==========================================
        // 1. ファイルハンドリング＆メディア制御
        // ==========================================
        let mainFiles = [], wipeFiles = [], bgmFiles = [];
        let isMainVideo = false, isWipeVideo = false;

        function handleFiles(type) {
            const input = document.getElementById(`${type}-file`);
            const select = document.getElementById(`${type}-file-select`);
            select.innerHTML = ''; 
            const files = Array.from(input.files);
            if (type === 'main') mainFiles = files; else wipeFiles = files;
            files.forEach((f, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = f.name; select.appendChild(opt); });
            if(files.length > 0) { 
                if(type === 'main') switchMainMedia(); 
                if(type === 'wipe') { switchWipeMedia(); activateOverlay('wipe'); }
            } else {
                select.innerHTML = '<option value="">Select File...</option>';
            }
        }

        function handleAudioFiles() {
            const input = document.getElementById('bgm-file');
            const select = document.getElementById('bgm-select');
            select.innerHTML = ''; bgmFiles = Array.from(input.files);
            bgmFiles.forEach((f, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = f.name; select.appendChild(opt); });
            if(bgmFiles.length === 0) select.innerHTML = '<option value="">Select Audio...</option>';
        }

        function switchMainMedia() {
            const select = document.getElementById('main-file-select');
            if(select.value === "") return;
            const file = mainFiles[select.value];
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                isMainVideo = true; const v = document.getElementById('main-video'); v.src = url; v.play();
            } else {
                isMainVideo = false; const i = document.getElementById('main-img'); i.src = url;
            }
        }

        function switchWipeMedia() {
            const select = document.getElementById('wipe-file-select');
            if(select.value === "") return;
            const file = wipeFiles[select.value];
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                isWipeVideo = true; const v = document.getElementById('wipe-video'); v.src = url; v.play();
            } else {
                isWipeVideo = false; const i = document.getElementById('wipe-img'); i.src = url;
            }
        }

        function playBgm() {
            const select = document.getElementById('bgm-select');
            if (select.value === "") return;
            const player = document.getElementById('bgm-player');
            player.src = URL.createObjectURL(bgmFiles[select.value]);
            player.play();
        }
        function stopBgm() { const p = document.getElementById('bgm-player'); p.pause(); p.currentTime = 0; }

        // 天気API
        let weatherData = { cond: '--', temp: '--', wind: '-- / --' };
        function fetchWeather() {
            if (!navigator.geolocation) return;
            weatherData.cond = "FETCHING...";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`);
                    const cw = (await res.json()).current_weather;
                    const c = cw.weathercode;
                    let condStr = 'STORM';
                    if(c===0) condStr='CLEAR'; else if(c<=3) condStr='CLOUDY'; else if(c<=48) condStr='FOG'; else if(c<=67) condStr='RAIN'; else if(c<=77) condStr='SNOW';
                    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
                    const dir = dirs[Math.round(cw.winddirection/45)%8];
                    
                    weatherData = { cond: condStr, temp: `${cw.temperature} °C`, wind: `${dir} / ${cw.windspeed} km/h` };
                } catch(e) { weatherData.cond = "ERROR"; }
            });
        }

        // ==========================================
        // 2. キャンバス描画エンジン (HTML/CSSを使わない完全P2P用)
        // ==========================================
        const canvas = document.getElementById('composite-canvas');
        const ctx = canvas.getContext('2d');

        // アニメーション状態管理
        let overlayState = { active: null, next: null, progress: 0, status: 'HIDDEN' }; // status: HIDDEN, IN, VISIBLE, OUT
        let speedState = { active: false, value: 124 };
        let speedInterval = null;

        function toggleSpeed(show) {
            speedState.active = show;
            if (show) {
                if(speedInterval) clearInterval(speedInterval);
                speedInterval = setInterval(() => {
                    speedState.value += Math.floor(Math.random() * 11) - 4;
                    if(speedState.value < 80) speedState.value = 80;
                    if(speedState.value > 195) speedState.value = 195;
                }, 150);
            } else { if(speedInterval) clearInterval(speedInterval); }
        }

        function activateOverlay(type) {
            if(type === 'weather') fetchWeather();
            if(overlayState.status === 'HIDDEN') {
                overlayState.active = type; overlayState.status = 'IN'; overlayState.progress = 0;
            } else if(overlayState.status === 'VISIBLE' && overlayState.active !== type) {
                overlayState.next = type; overlayState.status = 'OUT'; overlayState.progress = 1.0;
            }
        }

        function hideOverlays() {
            if(overlayState.status === 'VISIBLE') {
                overlayState.next = null; overlayState.status = 'OUT'; overlayState.progress = 1.0;
            }
        }

        function drawImageCover(ctx, img, x, y, w, h) {
            const imgW = img.videoWidth || img.width; const imgH = img.videoHeight || img.height;
            if(!imgW || !imgH) return;
            const ratio = Math.max(w / imgW, h / imgH);
            const drawW = imgW * ratio, drawH = imgH * ratio;
            const offsetX = x + (w - drawW) / 2, offsetY = y + (h - drawH) / 2;
            ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
            ctx.drawImage(img, offsetX, offsetY, drawW, drawH); ctx.restore();
        }

        // メインレンダリングループ
        let lastTime = 0;
        function renderLoop(time) {
            const dt = (time - lastTime) / 1000; lastTime = time;

            // 1. メイン映像の描画
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
            const mainMedia = isMainVideo ? document.getElementById('main-video') : document.getElementById('main-img');
            drawImageCover(ctx, mainMedia, 0, 0, 1920, 1080);

            // 2. 左下オーバーレイのアニメーション処理と描画
            const ox = 50, oy = 750, maxW = 800, maxH = 280;
            
            if (overlayState.status !== 'HIDDEN') {
                // アニメーション進行計算
                const speed = 2.5; // 速度
                if (overlayState.status === 'IN') {
                    overlayState.progress += dt * speed;
                    if(overlayState.progress >= 1) { overlayState.progress = 1; overlayState.status = 'VISIBLE'; }
                } else if (overlayState.status === 'OUT') {
                    overlayState.progress -= dt * speed;
                    if(overlayState.progress <= 0) {
                        if(overlayState.next) { overlayState.active = overlayState.next; overlayState.next = null; overlayState.status = 'IN'; overlayState.progress = 0; }
                        else { overlayState.status = 'HIDDEN'; }
                    }
                }

                // 描画：要素の大きさを決定
                let contentW = 480, contentH = 270;
                let textStr = "";
                if(overlayState.active === 'text') {
                    textStr = document.getElementById('overlay-text-input').value || " ";
                    ctx.font = "48px WRCCleanBold"; contentW = Math.min(ctx.measureText(textStr).width + 60, 1000); contentH = 100;
                } else if(overlayState.active === 'weather') {
                    contentW = 450; contentH = 180;
                }

                // オレンジブロックの座標計算 (スライドするアニメーション)
                // IN: 0 -> 0.5 (左から覆う), VISIBLE: 中身表示, OUT: 0.5 -> 0 (右へ抜ける)
                // 今回はシンプルに、progressに応じたブロック描画と、progress > 0.5 で中身描画
                const blockX = ox - contentW + (contentW * 2) * overlayState.progress;

                ctx.save();
                // 枠内クリッピング
                ctx.beginPath(); ctx.rect(ox, oy, contentW, contentH); ctx.clip();

                // 中身の描画 (完全に覆われている/表示フェーズの時のみ)
                if (overlayState.progress > 0.5 || overlayState.status === 'VISIBLE') {
                    if (overlayState.active === 'wipe') {
                        const wipeMedia = isWipeVideo ? document.getElementById('wipe-video') : document.getElementById('wipe-img');
                        drawImageCover(ctx, wipeMedia, ox, oy, contentW, contentH);
                        ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 8; ctx.strokeRect(ox, oy, contentW, contentH);
                    } else if (overlayState.active === 'text' || overlayState.active === 'weather') {
                        ctx.fillStyle = 'rgba(10, 25, 47, 0.95)'; ctx.fillRect(ox, oy, contentW, contentH);
                        ctx.fillStyle = '#ff5722'; ctx.fillRect(ox, oy, 10, contentH); // 左オレンジ線
                        
                        ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                        if (overlayState.active === 'text') {
                            ctx.font = "48px WRCCleanBold"; ctx.fillText(textStr, ox + 30, oy + 25);
                        } else {
                            ctx.fillStyle = '#ff5722'; ctx.font = "24px WRCCleanBold"; ctx.fillText("WEATHER CONDITION", ox + 30, oy + 20);
                            ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(ox + 30, oy + 55, contentW - 50, 2);
                            ctx.fillStyle = '#fff'; ctx.font = "32px WRCCleanBold";
                            ctx.fillText(`COND: ${weatherData.cond}`, ox + 30, oy + 70);
                            ctx.fillText(`TEMP: ${weatherData.temp}`, ox + 30, oy + 105);
                            ctx.fillText(`WIND: ${weatherData.wind}`, ox + 30, oy + 140);
                        }
                    }
                }

                // オレンジの帯を描画 (中身の上から覆い被さる)
                if(overlayState.status === 'IN' || overlayState.status === 'OUT') {
                    ctx.fillStyle = '#ff5722'; ctx.fillRect(blockX, oy, contentW, contentH);
                }
                ctx.restore();
            }

            // 3. 右下スピードメーター
            if (speedState.active) {
                ctx.save();
                ctx.translate(1600, 950);
                ctx.transform(1, 0, -0.15, 1, 0, 0); // 斜体(Skew)エフェクト
                ctx.fillStyle = 'rgba(2, 12, 27, 0.9)'; ctx.fillRect(0, 0, 260, 100);
                ctx.fillStyle = '#ff5722'; ctx.fillRect(250, 0, 10, 100); // 右オレンジ線
                ctx.fillStyle = '#fff'; ctx.font = "72px WRCCleanBold"; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
                ctx.fillText(speedState.value, 160, 15);
                ctx.fillStyle = '#ff5722'; ctx.font = "24px WRCCleanBold"; ctx.textAlign = 'left';
                ctx.fillText("KM/H", 170, 50);
                ctx.restore();
            }

            requestAnimationFrame(renderLoop);
        }

        // ==========================================
        // 3. P2P WebRTC & Audio Mixer 処理 (画面共有を完全に排除)
        // ==========================================
        let peer = null;
        let mixedStream = null;
        let audioCtx = null;

        function initAudioMixer() {
            if(audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const dest = audioCtx.createMediaStreamDestination();

            // 動画の音とBGMをミックスする
            const mainVideo = document.getElementById('main-video');
            const bgmPlayer = document.getElementById('bgm-player');
            
            const src1 = audioCtx.createMediaElementSource(mainVideo);
            const src2 = audioCtx.createMediaElementSource(bgmPlayer);
            
            src1.connect(dest); src1.connect(audioCtx.destination); // 配信先とローカル両方に音を出す
            src2.connect(dest); src2.connect(audioCtx.destination);

            return dest.stream.getAudioTracks()[0]; // ミックスされた音声トラック
        }

        async function initBroadcast() {
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('broadcast-mode').style.display = 'flex';
            
            // Web Audio APIの初期化（ユーザーアクション直後に行う必要がある）
            const mixedAudioTrack = initAudioMixer();

            // Canvasから映像ストリームを取得 (30 FPS)
            const canvasStream = canvas.captureStream(30);
            const videoTrack = canvasStream.getVideoTracks()[0];

            // 映像トラックとミキシングした音声トラックを結合して最終ストリームを作成！
            mixedStream = new MediaStream([videoTrack, mixedAudioTrack]);

            // P2Pの起動
            const hostId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(hostId);
            peer.on('open', (id) => { document.getElementById('my-peer-id').innerText = id; });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data && data.type === 'HELLO_HOST') {
                        document.getElementById('p2p-status').innerText = "Viewer Connected!";
                        document.getElementById('p2p-status').style.color = "yellow";
                        // 生成済みの内部ストリームをそのまま通話で送信
                        peer.call(data.viewerId, mixedStream);
                    }
                });
            });

            // フォントのロードを待ってからレンダリング開始
            document.fonts.ready.then(() => { requestAnimationFrame(renderLoop); });
        }

        function initViewer() {
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('viewer-mode').style.display = 'flex';
            
            peer = new Peer();
            peer.on('open', () => { document.getElementById('viewer-status-text').innerText = "System Ready."; });
            
            peer.on('call', (call) => {
                document.getElementById('viewer-status-text').innerText = "Receiving P2P Stream...";
                call.answer();
                call.on('stream', (remoteStream) => {
                    document.getElementById('viewer-ui').style.display = 'none';
                    const video = document.getElementById('viewer-video');
                    video.style.display = 'block';
                    video.srcObject = remoteStream;
                });
            });
        }

        function connectToHost() {
            const hostId = document.getElementById('host-id-input').value.trim();
            if (!hostId || hostId.length !== 4) return alert("4桁のIDを入力してください");
            document.getElementById('viewer-status-text').innerText = "Connecting...";
            const conn = peer.connect(hostId);
            conn.on('open', () => { conn.send({ type: 'HELLO_HOST', viewerId: peer.id }); });
            conn.on('error', () => { alert("接続エラー"); });
        }
    </script>
</body>
</html>
