<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC P2P Broadcast System</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'WRCCleanBold';
            src: url('./WRCCleanBold.ttf') format('truetype');
        }

        :root {
            --wrc-navy: #0a192f;
            --wrc-navy-dark: #020c1b;
            --wrc-orange: #ff5722;
            --text-main: #e6f1ff;
        }

        * {
            box-sizing: border-box;
            font-family: 'WRCCleanBold', sans-serif;
            text-transform: uppercase;
        }

        body {
            margin: 0; padding: 0; background-color: var(--wrc-navy-dark);
            color: var(--text-main); overflow: hidden;
        }

        /* ----- モード選択画面 ----- */
        #mode-selection {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle, var(--wrc-navy), var(--wrc-navy-dark));
        }

        .btn {
            background-color: transparent; color: var(--wrc-orange); border: 2px solid var(--wrc-orange);
            padding: 15px 40px; font-size: 24px; margin: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        .btn:hover { background-color: var(--wrc-orange); color: var(--wrc-navy-dark); }

        /* ----- 視聴モード画面 ----- */
        #viewer-mode {
            display: none; height: 100vh; width: 100vw; flex-direction: column;
            align-items: center; justify-content: center; background-color: #000;
        }
        #viewer-ui {
            z-index: 100; position: absolute; background: var(--wrc-navy);
            padding: 30px; border: 2px solid var(--wrc-orange); text-align: center;
        }
        #viewer-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; display: none;
        }
        input[type="text"] {
            padding: 10px; font-size: 24px; background: var(--wrc-navy-dark);
            border: 1px solid var(--wrc-orange); color: white; margin-bottom: 15px;
            width: 200px; text-align: center; letter-spacing: 5px;
        }
        #viewer-status-text { color: yellow; font-size: 14px; margin-top: 10px; }

        /* ----- 放送モード画面 ----- */
        #broadcast-mode { display: none; height: 100vh; flex-direction: column; }

        #preview-wrapper {
            flex: 1; background-color: #000; position: relative; overflow: hidden;
        }
        #preview-area {
            width: 1920px; height: 1080px; position: absolute;
            top: 50%; left: 50%; transform-origin: center center; background-color: #111;
        }

        #controls {
            background-color: var(--wrc-navy); border-top: 2px solid var(--wrc-orange);
            padding: 15px; display: flex; gap: 15px; overflow-x: auto; flex-shrink: 0;
        }

        .control-group {
            background: var(--wrc-navy-dark); border: 1px solid rgba(255, 87, 34, 0.3);
            padding: 12px; min-width: 250px;
        }
        .control-group h3 {
            color: var(--wrc-orange); margin-top: 0; font-size: 14px;
            border-bottom: 1px solid var(--wrc-orange); padding-bottom: 5px; margin-bottom: 10px;
        }

        select.file-select {
            width: 100%; padding: 5px; margin-bottom: 10px; background: var(--wrc-navy);
            color: white; border: 1px solid var(--wrc-orange); font-family: monospace;
        }

        #main-media-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #main-media-container video, #main-media-container img { width: 100%; height: 100%; object-fit: cover; }

        /* 左下オーバーレイコンテナ (ワイプ・天気・テキストが排他で表示される) */
        #bottom-left-overlays {
            position: absolute; bottom: 30px; left: 30px;
            width: 600px; height: 300px;
            z-index: 10;
        }
        
        /* トランジション共通 */
        .reveal-wrapper {
            position: absolute; bottom: 0; left: 0;
            overflow: hidden; visibility: hidden; width: max-content;
        }
        .reveal-wrapper.is-visible { visibility: visible; }
        .reveal-content { opacity: 0; }
        .reveal-wrapper.is-visible .reveal-content { opacity: 1; }

        .reveal-blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--wrc-orange); transform: translateX(-101%); z-index: 20;
        }

        .reveal-wrapper.anim-in .reveal-blocker { animation: slide-blocker 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
        .reveal-wrapper.anim-in .reveal-content { animation: show-content 0.6s forwards; }
        .reveal-wrapper.anim-out .reveal-blocker { animation: slide-blocker-out 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
        .reveal-wrapper.anim-out .reveal-content { animation: hide-content 0.6s forwards; }

        @keyframes slide-blocker { 0% { transform: translateX(-101%); } 50% { transform: translateX(0); } 100% { transform: translateX(101%); } }
        @keyframes show-content { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
        @keyframes slide-blocker-out { 0% { transform: translateX(101%); } 50% { transform: translateX(0); } 100% { transform: translateX(-101%); } }
        @keyframes hide-content { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

        /* 各パーツのデザイン */
        #wipe-container {
            width: 380px; aspect-ratio: 16/9; background-color: #000; 
            border: 3px solid var(--wrc-orange); box-shadow: 5px 5px 20px rgba(0,0,0,0.8);
        }
        #wipe-container video, #wipe-container img { width: 100%; height: 100%; object-fit: cover; }

        .info-panel {
            background-color: var(--wrc-navy); border-left: 6px solid var(--wrc-orange);
            padding: 15px 25px; font-size: 24px; letter-spacing: 1px; line-height: 1.3;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.8);
        }
        #weather-overlay .header { color: var(--wrc-orange); font-size: 20px; margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        
        /* テキストの巨大化 */
        #text-overlay {
            font-size: 48px; /* 文字を大きく */
            max-width: 800px;
            padding: 20px 30px;
        }

        /* WRC風スピードメーター (右下独立) */
        #speed-wrapper {
            position: absolute; bottom: 30px; right: 30px; left: auto;
            transform: skewX(-10deg); /* WRC特有の少し斜体のかかったUI */
        }
        #speed-overlay {
            background-color: rgba(2, 12, 27, 0.9);
            border-right: 8px solid var(--wrc-orange);
            padding: 10px 30px;
            box-shadow: -5px 5px 20px rgba(0,0,0,0.8);
            display: flex; align-items: baseline; gap: 10px;
        }
        #speed-value {
            font-size: 72px; color: white; font-weight: bold;
            font-variant-numeric: tabular-nums;
        }
        .speed-unit {
            font-size: 24px; color: var(--wrc-orange); font-weight: bold;
        }

        #broadcast-info {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.7); padding: 10px; font-size: 18px; color: yellow;
            border: 2px solid yellow; letter-spacing: 2px;
        }
        .btn-small { width: 48%; margin: 0; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="mode-selection">
        <h1 style="font-size: 60px; margin-bottom: 10px; color: white;">P2P RALLY BROADCAST</h1>
        <button class="btn" onclick="initViewer()">VIEWER MODE</button>
        <button class="btn" onclick="initBroadcast()">BROADCAST MODE</button>
    </div>

    <div id="viewer-mode">
        <div id="viewer-ui">
            <h2 style="color: var(--wrc-orange);">CONNECT TO HOST</h2>
            <p style="font-size: 14px;">放送画面左上の4桁の数字を入力</p>
            <input type="text" id="host-id-input" placeholder="0000" maxlength="4">
            <br>
            <button class="btn" onclick="connectToHost()">CONNECT</button>
            <div id="viewer-status-text">Ready</div>
        </div>
        <video id="viewer-video" autoplay playsinline></video>
    </div>

    <div id="broadcast-mode">
        <div id="broadcast-info">
            ID: <span id="my-peer-id">----</span> | <span id="p2p-status" style="font-size:14px;">Starting...</span>
        </div>

        <div id="preview-wrapper">
            <div id="preview-area">
                <div id="main-media-container"></div>
                
                <div id="bottom-left-overlays">
                    <div id="wipe-wrapper" class="reveal-wrapper">
                        <div class="reveal-blocker"></div>
                        <div id="wipe-container" class="reveal-content"></div>
                    </div>
                    <div id="weather-wrapper" class="reveal-wrapper">
                        <div class="reveal-blocker"></div>
                        <div id="weather-overlay" class="reveal-content info-panel">
                            <div class="header">WEATHER CONDITION</div>
                            <div id="weather-cond">COND: --</div>
                            <div id="weather-temp">TEMP: -- °C</div>
                            <div id="weather-wind">WIND: -- / -- km/h</div>
                        </div>
                    </div>
                    <div id="text-wrapper" class="reveal-wrapper">
                        <div class="reveal-blocker"></div>
                        <div id="text-overlay" class="reveal-content info-panel"></div>
                    </div>
                </div>

                <div id="speed-wrapper" class="reveal-wrapper">
                    <div class="reveal-blocker"></div>
                    <div id="speed-overlay" class="reveal-content">
                        <span id="speed-value">124</span>
                        <span class="speed-unit">KM/H</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="controls">
            <div class="control-group">
                <h3>MAIN MEDIA</h3>
                <input type="file" id="main-file" accept="video/*,image/*" multiple onchange="handleFiles('main')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="main-file-select" class="file-select" onchange="switchMainMedia()">
                    <option value="">Select File...</option>
                </select>
            </div>
            
            <div class="control-group">
                <h3>WIPE / IMAGE (LEFT)</h3>
                <input type="file" id="wipe-file" accept="video/*,image/*" multiple onchange="handleFiles('wipe')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="wipe-file-select" class="file-select" onchange="switchWipeMedia()">
                    <option value="">Select File...</option>
                </select>
                <div>
                    <button class="btn btn-small" onclick="activateOverlay('wipe', showWipeMedia)">SHOW</button>
                    <button class="btn btn-small" onclick="hideAllLeftOverlays()" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>TEXT & WEATHER (LEFT)</h3>
                <input type="text" id="overlay-text-input" placeholder="TEXT..." style="width: 100%; font-size: 14px; margin-bottom: 5px;">
                <div style="margin-bottom: 5px;">
                    <button class="btn btn-small" onclick="activateOverlay('text', updateText)">TXT ON</button>
                    <button class="btn btn-small" onclick="hideAllLeftOverlays()" style="border-color: gray; color: gray;">HIDE</button>
                </div>
                <div>
                    <button class="btn btn-small" onclick="activateOverlay('weather', fetchWeather)">WTH ON</button>
                </div>
            </div>

            <div class="control-group" style="border-color: #ff9800;">
                <h3 style="color: #ff9800;">SPEED METER (RIGHT)</h3>
                <div style="margin-top: 10px;">
                    <button class="btn btn-small" onclick="toggleSpeed(true)" style="border-color: #ff9800; color: #ff9800;">ON</button>
                    <button class="btn btn-small" onclick="toggleSpeed(false)" style="border-color: gray; color: gray;">OFF</button>
                </div>
            </div>

            <div class="control-group" style="border-color: #2196F3;">
                <h3 style="color: #2196F3;">BGM AUDIO</h3>
                <input type="file" id="bgm-file" accept="audio/*, .mp3, .wav, .m4a" multiple onchange="handleAudioFiles()" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="bgm-select" class="file-select">
                    <option value="">Select Audio...</option>
                </select>
                <div>
                    <button class="btn btn-small" onclick="playBgm()" style="border-color: #2196F3; color: #2196F3;">PLAY</button>
                    <button class="btn btn-small" onclick="stopBgm()" style="border-color: gray; color: gray;">STOP</button>
                </div>
                <audio id="bgm-player" loop></audio>
            </div>
        </div>
    </div>

    <script>
        function resizePreview() {
            const wrapper = document.getElementById('preview-wrapper');
            const area = document.getElementById('preview-area');
            if(!wrapper) return;
            const scale = Math.min(wrapper.clientWidth / 1920, wrapper.clientHeight / 1080);
            area.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', resizePreview);

        function createMediaElement(file) {
            const fileURL = URL.createObjectURL(file);
            let el;
            if (file.type.startsWith('video/')) {
                el = document.createElement('video'); el.src = fileURL; el.autoplay = true; el.loop = true; el.muted = true;
            } else {
                el = document.createElement('img'); el.src = fileURL;
            }
            return el;
        }

        let mainFiles = [], wipeFiles = [], bgmFiles = [];

        function handleFiles(type) {
            const input = document.getElementById(`${type}-file`);
            const select = document.getElementById(`${type}-file-select`);
            select.innerHTML = ''; 
            const files = Array.from(input.files);
            if (type === 'main') mainFiles = files; else wipeFiles = files;
            files.forEach((f, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = f.name; select.appendChild(opt); });
            if(files.length > 0) { if(type === 'main') switchMainMedia(); if(type === 'wipe') switchWipeMedia(); } 
            else select.innerHTML = '<option value="">Select File...</option>';
        }

        // MP3などの音声ファイル処理
        function handleAudioFiles() {
            const input = document.getElementById('bgm-file');
            const select = document.getElementById('bgm-select');
            select.innerHTML = '';
            bgmFiles = Array.from(input.files);
            bgmFiles.forEach((f, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = f.name; select.appendChild(opt); });
            if(bgmFiles.length === 0) select.innerHTML = '<option value="">Select Audio...</option>';
        }

        function playBgm() {
            const select = document.getElementById('bgm-select');
            const player = document.getElementById('bgm-player');
            if (select.value === "" || bgmFiles.length === 0) return;
            player.src = URL.createObjectURL(bgmFiles[select.value]);
            player.play();
        }
        function stopBgm() { document.getElementById('bgm-player').pause(); document.getElementById('bgm-player').currentTime = 0; }

        function switchMainMedia() {
            const select = document.getElementById('main-file-select');
            if(select.value === "") return;
            const container = document.getElementById('main-media-container');
            container.innerHTML = ''; container.appendChild(createMediaElement(mainFiles[select.value]));
        }
        function switchWipeMedia() {
            const select = document.getElementById('wipe-file-select');
            if(select.value === "") return false;
            const container = document.getElementById('wipe-container');
            container.innerHTML = ''; container.appendChild(createMediaElement(wipeFiles[select.value]));
            return true;
        }
        function updateText() {
            const text = document.getElementById('overlay-text-input').value;
            if (!text) return false; document.getElementById('text-overlay').innerText = text; return true;
        }

        // --- 左下オーバーレイの排他制御 ---
        const leftOverlayTypes = ['wipe', 'weather', 'text'];
        
        function activateOverlay(targetType, updateFn = null) {
            leftOverlayTypes.forEach(type => {
                if (type !== targetType) toggleOverlay(type + '-wrapper', false);
            });
            setTimeout(() => { toggleOverlay(targetType + '-wrapper', true, updateFn); }, 100);
        }

        function hideAllLeftOverlays() {
            leftOverlayTypes.forEach(type => toggleOverlay(type + '-wrapper', false));
        }

        function toggleOverlay(wrapperId, show, updateFn = null) {
            const wrapper = document.getElementById(wrapperId);
            if (show) {
                if (wrapper.classList.contains('is-visible')) { if (updateFn) updateFn(); return; }
                if (updateFn && updateFn() === false) return;
                wrapper.classList.remove('anim-out'); wrapper.classList.add('anim-in'); wrapper.classList.add('is-visible');
                setTimeout(() => wrapper.classList.remove('anim-in'), 600);
            } else {
                if (!wrapper.classList.contains('is-visible')) return;
                wrapper.classList.remove('anim-in'); wrapper.classList.add('anim-out');
                setTimeout(() => { wrapper.classList.remove('is-visible'); wrapper.classList.remove('anim-out'); }, 600);
            }
        }

        // --- スピードメーター制御 ---
        let speedInterval = null;
        function toggleSpeed(show) {
            toggleOverlay('speed-wrapper', show);
            if (show) {
                let currentSpeed = 124; // 初期速度
                if(speedInterval) clearInterval(speedInterval);
                speedInterval = setInterval(() => {
                    // ラリーっぽく -4 から +6 の範囲で激しく変動させる
                    currentSpeed += Math.floor(Math.random() * 11) - 4;
                    if(currentSpeed < 80) currentSpeed = 80;
                    if(currentSpeed > 195) currentSpeed = 195;
                    document.getElementById('speed-value').innerText = currentSpeed;
                }, 150); // 細かく更新
            } else {
                if(speedInterval) clearInterval(speedInterval);
            }
        }

        function getWindDirection(deg) { const d = ['N','NE','E','SE','S','SW','W','NW']; return d[Math.round(deg/45)%8]; }
        function getWeatherCondition(c) { if(c===0)return 'CLEAR'; if(c<=3)return 'CLOUDY'; if(c<=48)return 'FOG'; if(c<=67)return 'RAIN'; if(c<=77)return 'SNOW'; return 'STORM'; }
        
        function fetchWeather() {
            if (!navigator.geolocation) return false;
            document.getElementById('weather-cond').innerText = "COND: FETCHING...";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`);
                    const cw = (await res.json()).current_weather;
                    document.getElementById('weather-cond').innerText = `COND: ${getWeatherCondition(cw.weathercode)}`;
                    document.getElementById('weather-temp').innerText = `TEMP: ${cw.temperature} °C`;
                    document.getElementById('weather-wind').innerText = `WIND: ${getWindDirection(cw.winddirection)} / ${cw.windspeed} km/h`;
                } catch(e) {}
            });
            return true;
        }

        // ==========================================
        // P2P 配信・受信ロジック (自動キャプチャ付き)
        // ==========================================
        let peer = null;
        let localStream = null;

        async function initBroadcast() {
            // 先にキャプチャを要求する（ユーザーがボタンを押した直後なのでブラウザにブロックされない）
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
                    audio: true // BGMも配信に乗せるためON
                });
            } catch (err) {
                alert("画面キャプチャがキャンセルされたため、配信できません。リロードしてください。");
                return;
            }

            // キャプチャ成功後、画面を切り替えてPeerJSを準備
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('broadcast-mode').style.display = 'flex';
            resizePreview();
            
            document.getElementById('p2p-status').innerText = "Ready. Waiting for viewers.";
            document.getElementById('p2p-status').style.color = "#4CAF50";

            localStream.getVideoTracks()[0].onended = () => {
                document.getElementById('p2p-status').innerText = "Capture stopped.";
                document.getElementById('p2p-status').style.color = "red";
                localStream = null;
            };

            const hostId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(hostId);

            peer.on('open', (id) => { document.getElementById('my-peer-id').innerText = id; });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data && data.type === 'HELLO_HOST') {
                        if (localStream) {
                            document.getElementById('p2p-status').innerText = "Connecting Viewer...";
                            peer.call(data.viewerId, localStream);
                            setTimeout(() => { document.getElementById('p2p-status').innerText = "LIVE (Viewer Connected)"; }, 500);
                        }
                    }
                });
            });
        }

        function initViewer() {
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('viewer-mode').style.display = 'flex';
            
            peer = new Peer();
            peer.on('open', () => { document.getElementById('viewer-status-text').innerText = "System Ready."; });
            
            peer.on('call', (call) => {
                document.getElementById('viewer-status-text').innerText = "Receiving Stream...";
                call.answer();
                call.on('stream', (remoteStream) => {
                    document.getElementById('viewer-ui').style.display = 'none';
                    const video = document.getElementById('viewer-video');
                    video.style.display = 'block';
                    video.srcObject = remoteStream;
                });
            });
        }

        function connectToHost() {
            const hostId = document.getElementById('host-id-input').value.trim();
            if (!hostId || hostId.length !== 4) return alert("4桁のIDを入力してください");

            document.getElementById('viewer-status-text').innerText = "Connecting to Host...";
            
            const conn = peer.connect(hostId);
            conn.on('open', () => {
                document.getElementById('viewer-status-text').innerText = "Requesting Video...";
                conn.send({ type: 'HELLO_HOST', viewerId: peer.id });
            });
            conn.on('error', () => {
                document.getElementById('viewer-status-text').innerText = "Error: Cannot connect.";
                alert("接続に失敗しました。IDが間違っているか、ホストが存在しません。");
            });
        }
    </script>
</body>
</html>
