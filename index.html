<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC P2P Broadcast System</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'WRCCleanBold';
            src: url('./WRCCleanBold.ttf') format('truetype');
        }

        :root {
            --wrc-navy: #0a192f;
            --wrc-navy-dark: #020c1b;
            --wrc-orange: #ff5722;
            --text-main: #e6f1ff;
        }

        * {
            box-sizing: border-box;
            font-family: 'WRCCleanBold', sans-serif;
            text-transform: uppercase;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--wrc-navy-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        /* ----- モード選択画面 ----- */
        #mode-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle, var(--wrc-navy), var(--wrc-navy-dark));
        }

        .btn {
            background-color: transparent;
            color: var(--wrc-orange);
            border: 2px solid var(--wrc-orange);
            padding: 15px 40px;
            font-size: 24px;
            margin: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .btn:hover {
            background-color: var(--wrc-orange);
            color: var(--wrc-navy-dark);
            box-shadow: 0 0 15px var(--wrc-orange);
        }

        /* ----- 視聴モード画面 ----- */
        #viewer-mode {
            display: none;
            height: 100vh;
            width: 100vw;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        #viewer-ui {
            z-index: 100;
            position: absolute;
            background: var(--wrc-navy);
            padding: 30px;
            border: 2px solid var(--wrc-orange);
            text-align: center;
        }
        #viewer-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 18px;
            background: var(--wrc-navy-dark);
            border: 1px solid var(--wrc-orange);
            color: white;
            margin-bottom: 15px;
            width: 300px;
            text-align: center;
        }

        /* ----- 放送モード画面 ----- */
        #broadcast-mode {
            display: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #preview-wrapper {
            flex: 1;
            background-color: #000;
            position: relative;
            overflow: hidden; /* はみ出した部分はカットしてギリギリまで拡大 */
        }

        #preview-area {
            width: 1920px;
            height: 1080px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            background-color: #111;
        }

        #controls {
            background-color: var(--wrc-navy);
            border-top: 2px solid var(--wrc-orange);
            padding: 15px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            flex-shrink: 0; /* コントロールパネルの高さは圧縮しない */
        }

        .control-group {
            background: var(--wrc-navy-dark);
            border: 1px solid rgba(255, 87, 34, 0.3);
            padding: 12px;
            min-width: 250px;
        }

        .control-group h3 {
            color: var(--wrc-orange);
            margin-top: 0;
            font-size: 14px;
            border-bottom: 1px solid var(--wrc-orange);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* ファイル切り替え用セレクトボックス */
        select.file-select {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
            background: var(--wrc-navy);
            color: white;
            border: 1px solid var(--wrc-orange);
            font-family: monospace;
        }

        #main-media-container {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        #main-media-container video, #main-media-container img {
            width: 100%; height: 100%; 
            object-fit: cover; /* 黒帯が出ないよう画面いっぱいに埋める */
        }

        /* オーバーレイ全体をさらに左下へ */
        #bottom-left-overlays {
            position: absolute;
            bottom: 20px; left: 20px;
            display: flex; flex-direction: column; gap: 15px;
            align-items: flex-start;
            z-index: 10;
        }

        /* --- オレンジ帯トランジション --- */
        .reveal-wrapper {
            position: relative;
            overflow: hidden;
            visibility: hidden;
        }
        .reveal-wrapper.is-visible { visibility: visible; }
        .reveal-content { opacity: 0; }
        .reveal-wrapper.is-visible .reveal-content { opacity: 1; }

        .reveal-blocker {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--wrc-orange);
            transform: translateX(-101%);
            z-index: 20;
        }

        .reveal-wrapper.anim-in .reveal-blocker { animation: slide-blocker 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
        .reveal-wrapper.anim-in .reveal-content { animation: show-content 0.6s forwards; }
        .reveal-wrapper.anim-out .reveal-blocker { animation: slide-blocker-out 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
        .reveal-wrapper.anim-out .reveal-content { animation: hide-content 0.6s forwards; }

        @keyframes slide-blocker {
            0% { transform: translateX(-101%); }
            50% { transform: translateX(0); }
            100% { transform: translateX(101%); }
        }
        @keyframes show-content {
            0%, 49% { opacity: 0; }
            50%, 100% { opacity: 1; }
        }
        @keyframes slide-blocker-out {
            0% { transform: translateX(101%); }
            50% { transform: translateX(0); }
            100% { transform: translateX(-101%); }
        }
        @keyframes hide-content {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* 各種オーバーレイのサイズ縮小と影の付与 */
        #wipe-container {
            width: 320px; /* 小さくしました */
            aspect-ratio: 16/9;
            background-color: #000; 
            border: 3px solid var(--wrc-orange);
            box-shadow: 5px 5px 20px rgba(0,0,0,0.8); /* 影を中身に移動 */
        }
        #wipe-container video, #wipe-container img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .info-panel {
            background-color: var(--wrc-navy);
            border-left: 6px solid var(--wrc-orange);
            padding: 10px 15px; /* 余白を縮小 */
            font-size: 18px; /* フォントサイズを縮小 */
            letter-spacing: 1px;
            line-height: 1.3;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.8); /* 影を中身に移動 */
        }

        #weather-overlay .header { 
            color: var(--wrc-orange); 
            font-size: 16px; 
            margin-bottom: 5px; 
            border-bottom: 1px solid rgba(255,255,255,0.2); 
        }
        
        #broadcast-info {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.7); padding: 10px; font-size: 14px; color: yellow;
        }

        .btn-small {
            width: 48%; margin: 0; padding: 8px; font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="mode-selection">
        <h1 style="font-size: 60px; margin-bottom: 10px; color: white;">P2P RALLY BROADCAST</h1>
        <p style="margin-bottom: 50px; font-size: 20px; color: gray;">Powered by PeerJS</p>
        <button class="btn" onclick="initViewer()">VIEWER MODE</button>
        <button class="btn" onclick="initBroadcast()">BROADCAST MODE</button>
    </div>

    <div id="viewer-mode">
        <div id="viewer-ui">
            <h2 style="color: var(--wrc-orange);">CONNECT TO BROADCAST</h2>
            <p style="font-size: 14px;">放送画面に表示されているIDを入力</p>
            <input type="text" id="host-id-input" placeholder="HOST ID">
            <br>
            <button class="btn" onclick="connectToHost()">CONNECT</button>
        </div>
        <video id="viewer-video" autoplay playsinline></video>
    </div>

    <div id="broadcast-mode">
        <div id="broadcast-info">
            HOST ID: <span id="my-peer-id">Generating...</span><br>
            <span id="p2p-status">Not connected</span>
        </div>

        <div id="preview-wrapper">
            <div id="preview-area">
                <div id="main-media-container"></div>
                <div id="bottom-left-overlays">
                    <div id="wipe-wrapper" class="reveal-wrapper">
                        <div class="reveal-blocker"></div>
                        <div id="wipe-container" class="reveal-content"></div>
                    </div>
                    <div id="weather-wrapper" class="reveal-wrapper">
                        <div class="reveal-blocker"></div>
                        <div id="weather-overlay" class="reveal-content info-panel">
                            <div class="header">WEATHER CONDITION</div>
                            <div id="weather-cond">COND: --</div>
                            <div id="weather-temp">TEMP: -- °C</div>
                            <div id="weather-wind">WIND: -- / -- km/h</div>
                        </div>
                    </div>
                    <div id="text-wrapper" class="reveal-wrapper">
                        <div class="reveal-blocker"></div>
                        <div id="text-overlay" class="reveal-content info-panel" style="max-width: 500px; word-wrap: break-word;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="controls">
            <div class="control-group" style="border-color: #4CAF50;">
                <h3 style="color: #4CAF50;">P2P STREAMING</h3>
                <p style="font-size: 11px; color: #ccc;">START CAPTUREを押して<br>このタブを共有</p>
                <button class="btn" onclick="startScreenCapture()" style="width: 100%; margin: 0; padding: 10px; font-size: 14px; border-color: #4CAF50; color: #4CAF50;">START CAPTURE</button>
            </div>
            
            <div class="control-group">
                <h3>MAIN DISPLAY</h3>
                <input type="file" id="main-file" accept="video/*,image/*" multiple onchange="handleFiles('main')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="main-file-select" class="file-select" onchange="switchMainMedia()">
                    <option value="">ファイルを選択してください</option>
                </select>
            </div>
            
            <div class="control-group">
                <h3>WIPE DISPLAY</h3>
                <input type="file" id="wipe-file" accept="video/*,image/*" multiple onchange="handleFiles('wipe')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="wipe-file-select" class="file-select" onchange="switchWipeMedia()">
                    <option value="">ファイルを選択してください</option>
                </select>
                <div>
                    <button class="btn btn-small" onclick="toggleOverlay('wipe-wrapper', true)">SHOW</button>
                    <button class="btn btn-small" onclick="toggleOverlay('wipe-wrapper', false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>TELEMETRY TEXT</h3>
                <input type="text" id="overlay-text-input" placeholder="ENTER TEXT..." style="width: 100%; font-size: 14px; margin-bottom: 10px;">
                <div>
                    <button class="btn btn-small" onclick="toggleOverlay('text-wrapper', true, updateText)">SHOW</button>
                    <button class="btn btn-small" onclick="toggleOverlay('text-wrapper', false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>WEATHER</h3>
                <div style="margin-top: 25px;">
                    <button class="btn btn-small" onclick="toggleOverlay('weather-wrapper', true, fetchWeather)">FETCH & SHOW</button>
                    <button class="btn btn-small" onclick="toggleOverlay('weather-wrapper', false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // UIスケール調整 (ギリギリまで拡大＆中央配置)
        function resizePreview() {
            const wrapper = document.getElementById('preview-wrapper');
            const area = document.getElementById('preview-area');
            if(!wrapper) return;
            // wrapperのサイズに合わせて最大まで拡大（余白を潰す）
            const scale = Math.max(wrapper.clientWidth / 1920, wrapper.clientHeight / 1080);
            area.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', resizePreview);

        function createMediaElement(file) {
            const fileURL = URL.createObjectURL(file);
            let el;
            if (file.type.startsWith('video/')) {
                el = document.createElement('video');
                el.src = fileURL; el.autoplay = true; el.loop = true; el.muted = true;
            } else {
                el = document.createElement('img'); el.src = fileURL;
            }
            return el;
        }

        // --- 複数ファイル管理ロジック ---
        let mainFiles = [];
        let wipeFiles = [];

        function handleFiles(type) {
            const input = document.getElementById(`${type}-file`);
            const select = document.getElementById(`${type}-file-select`);
            select.innerHTML = ''; 
            
            const files = Array.from(input.files);
            if (type === 'main') mainFiles = files;
            else wipeFiles = files;

            files.forEach((file, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.text = file.name;
                select.appendChild(option);
            });

            // 読み込んだら自動的に最初のファイルをセット
            if(files.length > 0) {
                if(type === 'main') switchMainMedia();
                if(type === 'wipe') switchWipeMedia();
            } else {
                select.innerHTML = '<option value="">ファイルを選択してください</option>';
            }
        }

        function switchMainMedia() {
            const select = document.getElementById('main-file-select');
            if(select.value === "") return;
            const file = mainFiles[select.value];
            const container = document.getElementById('main-media-container');
            container.innerHTML = '';
            container.appendChild(createMediaElement(file));
        }

        function switchWipeMedia() {
            const select = document.getElementById('wipe-file-select');
            if(select.value === "") return false;
            const file = wipeFiles[select.value];
            const container = document.getElementById('wipe-container');
            container.innerHTML = '';
            container.appendChild(createMediaElement(file));
            return true;
        }

        function updateText() {
            const text = document.getElementById('overlay-text-input').value;
            if (!text) return false;
            document.getElementById('text-overlay').innerText = text;
            return true;
        }

        function toggleOverlay(wrapperId, show, updateFn = null) {
            const wrapper = document.getElementById(wrapperId);
            if (show) {
                if (wrapper.classList.contains('is-visible')) {
                    // 既に表示中の場合はアニメーションなしで中身だけ即時更新
                    if (updateFn) updateFn();
                    return;
                }
                if (updateFn && updateFn() === false) return;
                wrapper.classList.remove('anim-out');
                wrapper.classList.add('anim-in');
                wrapper.classList.add('is-visible');
                setTimeout(() => wrapper.classList.remove('anim-in'), 600);
            } else {
                if (!wrapper.classList.contains('is-visible')) return;
                wrapper.classList.remove('anim-in');
                wrapper.classList.add('anim-out');
                setTimeout(() => {
                    wrapper.classList.remove('is-visible');
                    wrapper.classList.remove('anim-out');
                }, 600);
            }
        }

        function getWindDirection(degree) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(degree / 45) % 8];
        }
        function getWeatherCondition(code) {
            if (code === 0) return 'CLEAR';
            if (code <= 3) return 'CLOUDY';
            if (code <= 48) return 'FOG';
            if (code <= 67) return 'RAIN';
            if (code <= 77) return 'SNOW';
            if (code >= 95) return 'THUNDERSTORM';
            return 'UNKNOWN';
        }
        function fetchWeather() {
            if (!navigator.geolocation) { alert("Geolocation not supported."); return false; }
            document.getElementById('weather-cond').innerText = "COND: FETCHING...";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude; const lon = pos.coords.longitude;
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const data = await res.json();
                    const cw = data.current_weather;
                    document.getElementById('weather-cond').innerText = `COND: ${getWeatherCondition(cw.weathercode)}`;
                    document.getElementById('weather-temp').innerText = `TEMP: ${cw.temperature} °C`;
                    document.getElementById('weather-wind').innerText = `WIND: ${getWindDirection(cw.winddirection)} / ${cw.windspeed} km/h`;
                } catch (e) { document.getElementById('weather-cond').innerText = "COND: ERROR"; }
            });
            return true;
        }

        // ==========================================
        // P2P ハンドシェイク & ストリーミングロジック (改修版)
        // ==========================================
        let peer = null;
        let localStream = null;

        function initBroadcast() {
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('broadcast-mode').style.display = 'flex';
            resizePreview();

            const hostId = 'wrc-' + Math.random().toString(36).substr(2, 6);
            peer = new Peer(hostId);

            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
            });

            // 視聴者からの文字データ（ハンドシェイク）を待つ
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data && data.type === 'HELLO_HOST') {
                        console.log("視聴者を確認:", data.viewerId);
                        if (localStream) {
                            // ホスト側から視聴者へ映像を「発信」する
                            peer.call(data.viewerId, localStream);
                            document.getElementById('p2p-status').innerText = "Viewer Connected!";
                            document.getElementById('p2p-status').style.color = "yellow";
                        } else {
                            alert("視聴者が接続しましたが、映像のキャプチャが開始されていません！");
                        }
                    }
                });
            });
        }

        async function startScreenCapture() {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
                    audio: false
                });
                document.getElementById('p2p-status').innerText = "Capture active. Waiting for viewers...";
                document.getElementById('p2p-status').style.color = "#4CAF50";

                localStream.getVideoTracks()[0].onended = () => {
                    document.getElementById('p2p-status').innerText = "Capture stopped.";
                    document.getElementById('p2p-status').style.color = "red";
                    localStream = null;
                };
            } catch (err) {
                console.error("Capture Error:", err);
            }
        }

        function initViewer() {
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('viewer-mode').style.display = 'flex';
            peer = new Peer(); // ランダムIDで待機
        }

        function connectToHost() {
            const hostId = document.getElementById('host-id-input').value.trim();
            if (!hostId) return;

            // 1. まず文字データでホストに自分のIDを教える
            const conn = peer.connect(hostId);
            conn.on('open', () => {
                console.log("ホストにハンドシェイクを送信");
                conn.send({ type: 'HELLO_HOST', viewerId: peer.id });
            });

            // 2. ホストからの着信（映像）を待ち受ける
            peer.on('call', (call) => {
                call.answer(); // 着信を許可する
                call.on('stream', (remoteStream) => {
                    // 映像を受信したら画面を切り替え
                    document.getElementById('viewer-ui').style.display = 'none';
                    const video = document.getElementById('viewer-video');
                    video.style.display = 'block';
                    video.srcObject = remoteStream;
                });
            });

            conn.on('error', (err) => {
                alert("接続エラー: IDを確認してください。");
            });
        }
    </script>
</body>
</html>
