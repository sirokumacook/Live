<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC P2P Broadcast System</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face { font-family: 'WRCCleanBold'; src: url('./WRCCleanBold.ttf') format('truetype'); }
        :root { --wrc-navy: #0a192f; --wrc-navy-dark: #020c1b; --wrc-orange: #ff5722; --text-main: #e6f1ff; }
        * { box-sizing: border-box; font-family: 'WRCCleanBold', sans-serif; text-transform: uppercase; }
        body { margin: 0; padding: 0; background-color: var(--wrc-navy-dark); color: var(--text-main); overflow: hidden; }

        /* ----- モード選択画面 ----- */
        #mode-selection {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle, var(--wrc-navy), var(--wrc-navy-dark)); position: relative;
        }
        #version-text { position: absolute; bottom: 15px; right: 25px; color: rgba(255, 255, 255, 0.3); font-size: 14px; letter-spacing: 2px; }
        .btn { background-color: transparent; color: var(--wrc-orange); border: 2px solid var(--wrc-orange); padding: 15px 40px; font-size: 24px; margin: 10px; cursor: pointer; transition: all 0.3s ease; }
        .btn:hover { background-color: var(--wrc-orange); color: var(--wrc-navy-dark); }

        /* ----- 視聴モード画面 ----- */
        #viewer-mode {
            display: none; height: 100vh; width: 100vw; flex-direction: column;
            align-items: center; justify-content: center; background-color: #000; position: relative;
        }
        #viewer-ui { z-index: 100; position: absolute; background: var(--wrc-navy); padding: 30px; border: 2px solid var(--wrc-orange); text-align: center; }
        /* controls 属性をHTML側に付与し、デバイスの標準プレイヤーを有効化 */
        #viewer-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
        
        #unmute-btn {
            display: none; position: absolute; top: 20px; right: 20px; z-index: 1000;
            padding: 15px 20px; background: var(--wrc-orange); color: #fff; border: none; font-size: 16px; cursor: pointer;
        }
        input[type="text"] { padding: 10px; font-size: 24px; background: var(--wrc-navy-dark); border: 1px solid var(--wrc-orange); color: white; margin-bottom: 15px; width: 200px; text-align: center; letter-spacing: 5px; }
        #viewer-status-text { color: yellow; font-size: 14px; margin-top: 10px; }

        /* ----- 放送モード画面 ----- */
        #broadcast-mode { display: none; height: 100vh; flex-direction: column; }
        #broadcast-info {
            position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7);
            padding: 10px; font-size: 18px; color: yellow; border: 2px solid yellow; letter-spacing: 2px;
        }

        #preview-wrapper { flex: 1; background-color: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #composite-canvas { background-color: #111; max-width: 100%; max-height: 100%; object-fit: contain; }

        #controls {
            background-color: var(--wrc-navy); border-top: 2px solid var(--wrc-orange); padding: 15px; display: flex; gap: 15px; overflow-x: auto; flex-shrink: 0;
        }
        .control-group { background: var(--wrc-navy-dark); border: 1px solid rgba(255, 87, 34, 0.3); padding: 12px; min-width: 250px; }
        .control-group h3 { color: var(--wrc-orange); margin-top: 0; font-size: 14px; border-bottom: 1px solid var(--wrc-orange); padding-bottom: 5px; margin-bottom: 10px; }
        select.file-select { width: 100%; padding: 5px; margin-bottom: 10px; background: var(--wrc-navy); color: white; border: 1px solid var(--wrc-orange); font-family: monospace; }
        .btn-small { width: 48%; margin: 0; padding: 8px; font-size: 12px; }

        /* 動画が止まらないよう、不透明度をギリギリ残しつつサイズを持たせる */
        .hidden-media {
            position: absolute; width: 10px; height: 10px; opacity: 0.01;
            pointer-events: none; z-index: -1; top: 0; left: 0;
        }
    </style>
</head>
<body>

    <div id="mode-selection">
        <h1 style="font-size: 60px; margin-bottom: 10px; color: white;">P2P RALLY BROADCAST</h1>
        <button class="btn" onclick="initViewer()">VIEWER MODE</button>
        <button class="btn" onclick="initBroadcast()">BROADCAST MODE</button>
        <div id="version-text">VER 3.0.0 (SCHEDULE & NATIVE PLAYER)</div>
    </div>

    <div id="viewer-mode">
        <div id="viewer-ui">
            <h2 style="color: var(--wrc-orange);">CONNECT TO HOST</h2>
            <p style="font-size: 14px;">放送画面左上の4桁の数字を入力</p>
            <input type="text" id="host-id-input" placeholder="0000" maxlength="4">
            <br>
            <button class="btn" onclick="connectToHost()">CONNECT</button>
            <div id="viewer-status-text">Ready</div>
        </div>
        <video id="viewer-video" controls autoplay playsinline muted></video>
        <button id="unmute-btn" onclick="document.getElementById('viewer-video').muted = false; this.style.display='none';">🔊 UNMUTE AUDIO</button>
    </div>

    <div id="broadcast-mode">
        <div id="broadcast-info">
            ID: <span id="my-peer-id">----</span> | <span id="p2p-status" style="font-size:14px; color:#4CAF50;">LIVE (No viewers)</span>
        </div>

        <div id="preview-wrapper">
            <canvas id="composite-canvas" width="1920" height="1080"></canvas>
        </div>

        <div id="controls">
            <div class="control-group">
                <h3>MAIN MEDIA</h3>
                <input type="file" id="main-file" accept="video/*,image/*" multiple onchange="handleFiles('main')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="main-file-select" class="file-select" onchange="switchMainMedia()"><option value="">Select File...</option></select>
            </div>
            
            <div class="control-group">
                <h3>WIPE (LEFT MIDDLE)</h3>
                <input type="file" id="wipe-file" accept="video/*,image/*" multiple onchange="handleFiles('wipe')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="wipe-file-select" class="file-select" onchange="if(this.value!=='') toggleWipe(true)"><option value="">Wipe File...</option></select>
                <div>
                    <button class="btn btn-small" onclick="toggleWipe(true)">SHOW</button>
                    <button class="btn btn-small" onclick="toggleWipe(false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>TEXT & WEATHER (LEFT BTM)</h3>
                <input type="text" id="overlay-text-input" placeholder="TEXT..." style="width: 100%; font-size: 14px; margin-bottom: 5px;">
                <div style="margin-bottom: 5px;">
                    <button class="btn btn-small" onclick="activateInfo('text')">TXT ON</button>
                    <button class="btn btn-small" onclick="activateInfo('weather')">WTH ON</button>
                </div>
                <button class="btn btn-small" onclick="hideInfo()" style="border-color: gray; color: gray; width: 100%;">HIDE TEXT/WTH</button>
            </div>

            <div class="control-group" style="border-color: #9c27b0;">
                <h3 style="color: #9c27b0;">SCHEDULE / COMING UP</h3>
                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                    <input type="time" id="schedule-time" style="width: 40%; background: var(--wrc-navy); color: white; border: 1px solid #9c27b0; padding: 5px; font-family: monospace;">
                    <input type="text" id="schedule-text" placeholder="STAGE..." style="width: 60%; background: var(--wrc-navy); color: white; border: 1px solid #9c27b0; padding: 5px;">
                </div>
                <div>
                    <button class="btn btn-small" onclick="toggleSchedule(true)" style="border-color: #9c27b0; color: #9c27b0;">SHOW</button>
                    <button class="btn btn-small" onclick="toggleSchedule(false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>

            <div class="control-group" style="border-color: #ff9800;">
                <h3 style="color: #ff9800;">GPS SPEED</h3>
                <div style="margin-top: 10px;">
                    <button class="btn btn-small" onclick="toggleSpeed(true)" style="border-color: #ff9800; color: #ff9800;">ON</button>
                    <button class="btn btn-small" onclick="toggleSpeed(false)" style="border-color: gray; color: gray;">OFF</button>
                </div>
            </div>

            <div class="control-group" style="border-color: #2196F3;">
                <h3 style="color: #2196F3;">BGM AUDIO</h3>
                <input type="file" id="bgm-file" accept="audio/*, .mp3, .wav, .m4a" multiple onchange="handleAudioFiles()" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="bgm-select" class="file-select"><option value="">Select Audio...</option></select>
                <div>
                    <button class="btn btn-small" onclick="playBgm()" style="border-color: #2196F3; color: #2196F3;">PLAY</button>
                    <button class="btn btn-small" onclick="stopBgm()" style="border-color: gray; color: gray;">STOP</button>
                </div>
            </div>
        </div>

        <video id="main-video" class="hidden-media" autoplay loop playsinline muted></video>
        <img id="main-img" class="hidden-media">
        <video id="wipe-video" class="hidden-media" autoplay loop playsinline muted></video>
        <img id="wipe-img" class="hidden-media">
        <audio id="bgm-player" class="hidden-media" loop></audio>
    </div>

    <script>
        // ==========================================
        // 1. ファイル＆メディア制御
        // ==========================================
        let mainFiles = [], wipeFiles = [], bgmFiles = [];
        let isMainVideo = false, isWipeVideo = false;

        function handleFiles(type) {
            const input = document.getElementById(`${type}-file`);
            const select = document.getElementById(`${type}-file-select`);
            select.innerHTML = ''; 
            const files = Array.from(input.files);
            if (type === 'main') mainFiles = files; else wipeFiles = files;
            files.forEach((f, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = f.name; select.appendChild(opt); });
            if(files.length > 0) { 
                if(type === 'main') switchMainMedia(); 
                if(type === 'wipe') { switchWipeMedia(); toggleWipe(true); }
            } else { select.innerHTML = '<option value="">Select File...</option>'; }
        }

        function handleAudioFiles() {
            const input = document.getElementById('bgm-file');
            const select = document.getElementById('bgm-select');
            select.innerHTML = ''; bgmFiles = Array.from(input.files);
            bgmFiles.forEach((f, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = f.name; select.appendChild(opt); });
            if(bgmFiles.length === 0) select.innerHTML = '<option value="">Select Audio...</option>';
        }

        function switchMainMedia() {
            const select = document.getElementById('main-file-select');
            if(select.value === "") return;
            const file = mainFiles[select.value];
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                isMainVideo = true; 
                const v = document.getElementById('main-video'); 
                v.src = url; v.play();
            } else { isMainVideo = false; document.getElementById('main-img').src = url; }
        }

        function switchWipeMedia() {
            const select = document.getElementById('wipe-file-select');
            if(select.value === "") return;
            const file = wipeFiles[select.value];
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                isWipeVideo = true; 
                const v = document.getElementById('wipe-video'); 
                v.src = url; v.play();
            } else { isWipeVideo = false; document.getElementById('wipe-img').src = url; }
        }

        function playBgm() {
            const select = document.getElementById('bgm-select');
            if (select.value === "") return;
            const player = document.getElementById('bgm-player');
            player.src = URL.createObjectURL(bgmFiles[select.value]);
            player.play();
        }
        function stopBgm() { const p = document.getElementById('bgm-player'); p.pause(); p.currentTime = 0; }

        // ==========================================
        // 2. バックグラウンド天気取得
        // ==========================================
        let weatherData = { cond: '--', temp: '--', wind: '-- / --' };
        function fetchWeatherInBackground() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`);
                    const cw = (await res.json()).current_weather;
                    const c = cw.weathercode;
                    let condStr = 'STORM';
                    if(c===0) condStr='CLEAR'; else if(c<=3) condStr='CLOUDY'; else if(c<=48) condStr='FOG'; else if(c<=67) condStr='RAIN'; else if(c<=77) condStr='SNOW';
                    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
                    const dir = dirs[Math.round(cw.winddirection/45)%8];
                    weatherData = { cond: condStr, temp: `${cw.temperature} °C`, wind: `${dir} / ${cw.windspeed} km/h` };
                } catch(e) {}
            }, () => {}, { timeout: 10000 });
        }
        // 1分ごとに裏で検索
        setInterval(fetchWeatherInBackground, 60000);

        // ==========================================
        // 3. キャンバス描画エンジン＆アニメーション管理
        // ==========================================
        const canvas = document.getElementById('composite-canvas');
        const ctx = canvas.getContext('2d');

        // 各種状態の完全分離
        let wipeState = { status: 'HIDDEN', progress: 0 };
        let infoState = { active: null, next: null, status: 'HIDDEN', progress: 0 }; // Text / Weather用
        let scheduleState = { status: 'HIDDEN', progress: 0, time: '', text: '' };
        let speedState = { active: false, value: 0 };
        
        let geoWatchId = null;
        let speedInterval = null;
        let realGpsSpeed = 0;

        function toggleWipe(show) {
            if(show && wipeState.status === 'HIDDEN') { wipeState.status = 'IN'; wipeState.progress = 0; }
            else if(!show && wipeState.status === 'VISIBLE') { wipeState.status = 'OUT'; wipeState.progress = 1; }
        }

        function activateInfo(type) {
            if(infoState.status === 'HIDDEN') {
                infoState.active = type; infoState.status = 'IN'; infoState.progress = 0;
            } else if(infoState.status === 'VISIBLE' && infoState.active !== type) {
                infoState.next = type; infoState.status = 'OUT'; infoState.progress = 1.0;
            }
        }
        function hideInfo() {
            if(infoState.status === 'VISIBLE') { infoState.next = null; infoState.status = 'OUT'; infoState.progress = 1.0; }
        }

        function toggleSchedule(show) {
            if(show && scheduleState.status === 'HIDDEN') {
                scheduleState.time = document.getElementById('schedule-time').value || "00:00";
                scheduleState.text = document.getElementById('schedule-text').value || "NEXT STAGE";
                scheduleState.status = 'IN'; scheduleState.progress = 0;
            } else if(!show && scheduleState.status === 'VISIBLE') {
                scheduleState.status = 'OUT'; scheduleState.progress = 1;
            }
        }

        function toggleSpeed(show) {
            speedState.active = show;
            if (show) {
                // GPS取得
                if (navigator.geolocation) {
                    geoWatchId = navigator.geolocation.watchPosition((pos) => {
                        let s = pos.coords.speed;
                        realGpsSpeed = (s !== null && s > 0) ? Math.round(s * 3.6) : 0;
                    }, null, { enableHighAccuracy: true });
                }
                // 描画用の数値を常に変動させる（0なら擬似的に動かす）
                speedInterval = setInterval(() => {
                    if (realGpsSpeed > 0) {
                        speedState.value = realGpsSpeed;
                    } else {
                        // 止まっている時は120km/h前後で激しく動かしてWRC感を出す
                        speedState.value = 124 + Math.floor(Math.random() * 11) - 5;
                    }
                }, 150);
            } else {
                if (geoWatchId !== null) { navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; }
                if (speedInterval) { clearInterval(speedInterval); speedInterval = null; }
            }
        }

        function drawImageCover(ctx, img, x, y, w, h) {
            const imgW = img.videoWidth || img.naturalWidth || img.width; 
            const imgH = img.videoHeight || img.naturalHeight || img.height;
            if(!imgW || !imgH) return;
            const ratio = Math.max(w / imgW, h / imgH);
            const drawW = imgW * ratio, drawH = imgH * ratio;
            const offsetX = x + (w - drawW) / 2, offsetY = y + (h - drawH) / 2;
            ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
            ctx.drawImage(img, offsetX, offsetY, drawW, drawH); ctx.restore();
        }

        let lastTime = 0;
        function renderLoop(time) {
            const dt = (time - lastTime) / 1000; lastTime = time;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
            
            // 1. メイン映像
            const mainMedia = isMainVideo ? document.getElementById('main-video') : document.getElementById('main-img');
            drawImageCover(ctx, mainMedia, 0, 0, 1920, 1080);

            const animSpeed = 2.5;

            // 2. WIPEの描画 (左側、少し上 y=520)
            if (wipeState.status !== 'HIDDEN') {
                if(wipeState.status === 'IN') { wipeState.progress += dt*animSpeed; if(wipeState.progress>=1){wipeState.progress=1; wipeState.status='VISIBLE';} }
                else if(wipeState.status === 'OUT') { wipeState.progress -= dt*animSpeed; if(wipeState.progress<=0){wipeState.status='HIDDEN';} }
                
                const wx = 50, wy = 520, ww = 480, wh = 270;
                const blockX = wx - ww + (ww * 2) * wipeState.progress;
                ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
                if(wipeState.progress > 0.5 || wipeState.status === 'VISIBLE') {
                    const wipeMedia = isWipeVideo ? document.getElementById('wipe-video') : document.getElementById('wipe-img');
                    drawImageCover(ctx, wipeMedia, wx, wy, ww, wh);
                    ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 8; ctx.strokeRect(wx, wy, ww, wh);
                }
                if(wipeState.status === 'IN' || wipeState.status === 'OUT') { ctx.fillStyle = '#ff5722'; ctx.fillRect(blockX, wy, ww, wh); }
                ctx.restore();
            }

            // 3. TEXT & WEATHERの描画 (左下 y=820)
            if (infoState.status !== 'HIDDEN') {
                if(infoState.status === 'IN') { infoState.progress += dt*animSpeed; if(infoState.progress>=1){infoState.progress=1; infoState.status='VISIBLE';} }
                else if(infoState.status === 'OUT') { 
                    infoState.progress -= dt*animSpeed; 
                    if(infoState.progress<=0) {
                        if(infoState.next){ infoState.active = infoState.next; infoState.next = null; infoState.status = 'IN'; infoState.progress = 0; }
                        else { infoState.status = 'HIDDEN'; }
                    }
                }
                
                const ix = 50, iy = 820;
                let iw = 480, ih = 100;
                let textStr = "";
                if(infoState.active === 'text') {
                    textStr = document.getElementById('overlay-text-input').value || " ";
                    ctx.font = "48px WRCCleanBold"; iw = Math.min(ctx.measureText(textStr).width + 60, 1000); ih = 100;
                } else if(infoState.active === 'weather') {
                    iw = 450; ih = 180;
                }

                const blockX = ix - iw + (iw * 2) * infoState.progress;
                ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
                if(infoState.progress > 0.5 || infoState.status === 'VISIBLE') {
                    ctx.fillStyle = 'rgba(10, 25, 47, 0.95)'; ctx.fillRect(ix, iy, iw, ih);
                    ctx.fillStyle = '#ff5722'; ctx.fillRect(ix, iy, 10, ih); 
                    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    if(infoState.active === 'text') {
                        ctx.font = "48px WRCCleanBold"; ctx.fillText(textStr, ix + 30, iy + 25);
                    } else {
                        ctx.fillStyle = '#ff5722'; ctx.font = "24px WRCCleanBold"; ctx.fillText("WEATHER CONDITION", ix + 30, iy + 20);
                        ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(ix + 30, iy + 55, iw - 50, 2);
                        ctx.fillStyle = '#fff'; ctx.font = "32px WRCCleanBold";
                        ctx.fillText(`COND: ${weatherData.cond}`, ix + 30, iy + 70);
                        ctx.fillText(`TEMP: ${weatherData.temp}`, ix + 30, iy + 105);
                        ctx.fillText(`WIND: ${weatherData.wind}`, ix + 30, iy + 140);
                    }
                }
                if(infoState.status === 'IN' || infoState.status === 'OUT') { ctx.fillStyle = '#ff5722'; ctx.fillRect(blockX, iy, iw, ih); }
                ctx.restore();
            }

            // 4. SCHEDULE (タイマー) の描画 (画面下部中央)
            if (scheduleState.status !== 'HIDDEN') {
                if(scheduleState.status === 'IN') { scheduleState.progress += dt*animSpeed; if(scheduleState.progress>=1){scheduleState.progress=1; scheduleState.status='VISIBLE';} }
                else if(scheduleState.status === 'OUT') { scheduleState.progress -= dt*animSpeed; if(scheduleState.progress<=0){scheduleState.status='HIDDEN';} }

                const sx = 550, sy = 940, sw = 1000, sh = 110;
                const blockX = sx - sw + (sw * 2) * scheduleState.progress;

                ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
                if(scheduleState.progress > 0.5 || scheduleState.status === 'VISIBLE') {
                    // 背景パネル
                    ctx.fillStyle = 'rgba(10, 25, 47, 0.95)'; ctx.fillRect(sx, sy, sw, sh);
                    ctx.fillStyle = '#ff5722'; ctx.fillRect(sx, sy, sw, 6); // 上部のオレンジ線

                    // COMING UP NEXT
                    ctx.fillStyle = '#ff5722'; ctx.font = "20px WRCCleanBold"; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.fillText("COMING UP NEXT", sx + 25, sy + 25);

                    // LOCAL (オレンジ) + 時間とスケジュール (白)
                    ctx.font = "52px WRCCleanBold";
                    ctx.fillText("LOCAL", sx + 25, sy + 55);
                    const localWidth = ctx.measureText("LOCAL ").width;
                    
                    ctx.fillStyle = '#fff';
                    ctx.fillText(`${scheduleState.time}   ${scheduleState.text}`, sx + 25 + localWidth, sy + 55);
                }
                if(scheduleState.status === 'IN' || scheduleState.status === 'OUT') { ctx.fillStyle = '#ff5722'; ctx.fillRect(blockX, sy, sw, sh); }
                ctx.restore();
            }

            // 5. WRC SPEED METER (右下)
            if (speedState.active) {
                ctx.save();
                ctx.translate(1650, 950);
                ctx.transform(1, 0, -0.2, 1, 0, 0); 
                
                ctx.fillStyle = 'rgba(2, 12, 27, 0.85)'; ctx.fillRect(-160, -40, 320, 80); 
                ctx.fillStyle = '#ff5722'; ctx.fillRect(-160, -40, 320, 6); ctx.fillRect(-160, 36, 320, 4);

                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = "bold 64px WRCCleanBold"; ctx.fillText(speedState.value, -30, 0);
                
                ctx.fillStyle = '#ff5722'; ctx.font = "bold 24px WRCCleanBold"; ctx.fillText("KM/H", 80, 5);
                ctx.restore();
            }

            requestAnimationFrame(renderLoop);
        }

        // ==========================================
        // 4. P2P WebRTC & Audio Mixer
        // ==========================================
        let peer = null;
        let mixedStream = null;
        let audioCtx = null;

        function initAudioMixer() {
            if(audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const dest = audioCtx.createMediaStreamDestination();

            const mainVideo = document.getElementById('main-video');
            const wipeVideo = document.getElementById('wipe-video');
            const bgmPlayer = document.getElementById('bgm-player');
            
            const src1 = audioCtx.createMediaElementSource(mainVideo);
            const src2 = audioCtx.createMediaElementSource(bgmPlayer);
            const src3 = audioCtx.createMediaElementSource(wipeVideo);
            
            src1.connect(dest); src1.connect(audioCtx.destination);
            src2.connect(dest); src2.connect(audioCtx.destination);
            src3.connect(dest); // ワイプの音は配信に乗せるがローカルで二重再生しないよう調整

            return dest.stream.getAudioTracks()[0];
        }

        async function initBroadcast() {
            // 初期化時に裏で天気を一回取っておく
            fetchWeatherInBackground();

            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('broadcast-mode').style.display = 'flex';
            
            const mixedAudioTrack = initAudioMixer();

            // P2P送信用のストリーム生成 (負荷軽減のため24FPSに)
            const canvasStream = canvas.captureStream(24);
            const videoTrack = canvasStream.getVideoTracks()[0];
            mixedStream = new MediaStream([videoTrack, mixedAudioTrack]);

            const hostId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(hostId);
            peer.on('open', (id) => { document.getElementById('my-peer-id').innerText = id; });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data && data.type === 'HELLO_HOST') {
                        document.getElementById('p2p-status').innerText = "Viewer Connected!";
                        document.getElementById('p2p-status').style.color = "yellow";
                        peer.call(data.viewerId, mixedStream);
                    }
                });
            });

            document.fonts.ready.then(() => { requestAnimationFrame(renderLoop); });
        }

        function initViewer() {
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('viewer-mode').style.display = 'flex';
            
            peer = new Peer();
            peer.on('open', () => { document.getElementById('viewer-status-text').innerText = "System Ready."; });
            
            peer.on('call', (call) => {
                document.getElementById('viewer-status-text').innerText = "Receiving P2P Stream...";
                call.answer();
                call.on('stream', (remoteStream) => {
                    document.getElementById('viewer-ui').style.display = 'none';
                    const video = document.getElementById('viewer-video');
                    video.style.display = 'block';
                    video.srcObject = remoteStream;
                    document.getElementById('unmute-btn').style.display = 'block';
                });
            });
        }

        function connectToHost() {
            const hostId = document.getElementById('host-id-input').value.trim();
            if (!hostId || hostId.length !== 4) return alert("4桁のIDを入力してください");
            document.getElementById('viewer-status-text').innerText = "Connecting...";
            const conn = peer.connect(hostId);
            conn.on('open', () => { conn.send({ type: 'HELLO_HOST', viewerId: peer.id }); });
            conn.on('error', () => { alert("接続エラー"); });
        }
    </script>
</body>
</html>
