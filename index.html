<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC P2P Broadcast System</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face { font-family: 'WRCCleanBold'; src: url('./WRCCleanBold.ttf') format('truetype'); }
        :root { --wrc-navy: #0a192f; --wrc-navy-dark: #020c1b; --wrc-orange: #ff5722; --text-main: #e6f1ff; }
        * { box-sizing: border-box; font-family: 'WRCCleanBold', sans-serif; text-transform: uppercase; }
        body { margin: 0; padding: 0; background-color: var(--wrc-navy-dark); color: var(--text-main); overflow: hidden; }

        /* ----- モード選択画面 ----- */
        #mode-selection {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle, var(--wrc-navy), var(--wrc-navy-dark)); position: relative;
        }
        #version-text { position: absolute; bottom: 15px; right: 25px; color: rgba(255, 255, 255, 0.3); font-size: 14px; letter-spacing: 2px; }
        
        .btn { 
            background-color: transparent; color: var(--wrc-orange); border: 2px solid var(--wrc-orange); 
            padding: 15px 40px; font-size: 24px; margin: 10px; cursor: pointer; transition: all 0.3s ease; 
            z-index: 10; position: relative;
        }
        .btn:hover { background-color: var(--wrc-orange); color: var(--wrc-navy-dark); }

        /* ----- 視聴モード画面 ----- */
        #viewer-mode {
            display: none; height: 100vh; width: 100vw; flex-direction: column;
            align-items: center; justify-content: center; background-color: #000; position: relative;
        }
        #viewer-ui { z-index: 100; position: absolute; background: var(--wrc-navy); padding: 30px; border: 2px solid var(--wrc-orange); text-align: center; }
        #viewer-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
        
        #unmute-btn {
            display: none; position: absolute; top: 20px; right: 20px; z-index: 1000;
            padding: 15px 20px; background: var(--wrc-orange); color: #fff; border: none; font-size: 16px; cursor: pointer;
        }
        input[type="text"] { padding: 10px; font-size: 24px; background: var(--wrc-navy-dark); border: 1px solid var(--wrc-orange); color: white; margin-bottom: 15px; width: 200px; text-align: center; letter-spacing: 5px; }
        #viewer-status-text { color: yellow; font-size: 14px; margin-top: 10px; }

        /* ----- 放送モード画面 ----- */
        #broadcast-mode { display: none; height: 100vh; flex-direction: column; }
        #broadcast-info {
            position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7);
            padding: 10px; font-size: 18px; color: yellow; border: 2px solid yellow; letter-spacing: 2px;
        }

        #preview-wrapper { flex: 1; background-color: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #composite-canvas { background-color: #111; max-width: 100%; max-height: 100%; object-fit: contain; }

        #controls {
            background-color: var(--wrc-navy); border-top: 2px solid var(--wrc-orange); padding: 15px; display: flex; gap: 15px; overflow-x: auto; flex-shrink: 0;
        }
        .control-group { background: var(--wrc-navy-dark); border: 1px solid rgba(255, 87, 34, 0.3); padding: 12px; min-width: 250px; }
        .control-group h3 { color: var(--wrc-orange); margin-top: 0; font-size: 14px; border-bottom: 1px solid var(--wrc-orange); padding-bottom: 5px; margin-bottom: 10px; }
        select.file-select { width: 100%; padding: 5px; margin-bottom: 10px; background: var(--wrc-navy); color: white; border: 1px solid var(--wrc-orange); font-family: monospace; }
        .btn-small { width: 48%; margin: 0; padding: 8px; font-size: 12px; cursor: pointer; }

        /* 画面外に隔離して動画とストリーム用キャンバスを保持 */
        #media-pool {
            visibility: hidden; position: fixed; width: 1px; height: 1px; 
            overflow: hidden; pointer-events: none; z-index: -999;
        }
    </style>
</head>
<body>

    <div id="mode-selection">
        <h1 style="font-size: 60px; margin-bottom: 10px; color: white;">P2P RALLY BROADCAST</h1>
        <button class="btn" onclick="initViewer()">VIEWER MODE</button>
        <button class="btn" onclick="initBroadcast()">BROADCAST MODE</button>
        <div id="version-text">VER 5.0.0 (DUAL CANVAS ENGINE)</div>
    </div>

    <div id="viewer-mode">
        <div id="viewer-ui">
            <h2 style="color: var(--wrc-orange);">CONNECT TO HOST</h2>
            <p style="font-size: 14px;">放送画面左上の4桁の数字を入力</p>
            <input type="text" id="host-id-input" placeholder="0000" maxlength="4">
            <br>
            <button class="btn" onclick="connectToHost()">CONNECT</button>
            <div id="viewer-status-text">Ready</div>
        </div>
        <video id="viewer-video" controls autoplay playsinline muted></video>
        <button id="unmute-btn" onclick="document.getElementById('viewer-video').muted = false; this.style.display='none';">🔊 UNMUTE AUDIO</button>
    </div>

    <div id="broadcast-mode">
        <div id="broadcast-info">
            ID: <span id="my-peer-id">----</span> | <span id="p2p-status" style="font-size:14px; color:#4CAF50;">LIVE (No viewers)</span>
        </div>

        <div id="preview-wrapper">
            <canvas id="composite-canvas" width="1920" height="1080"></canvas>
        </div>

        <div id="controls">
            <div class="control-group" style="border-color: #4CAF50; min-width: 200px;">
                <h3 style="color: #4CAF50;">STREAM FPS (VIEWER)</h3>
                <div style="display: flex; gap: 5px; margin-top: 10px;">
                    <button id="fps-24-btn" class="btn btn-small" onclick="setFPS(24)" style="border-color: #4CAF50; color: #4CAF50; width: 50%;">24 FPS<br>(LITE)</button>
                    <button id="fps-60-btn" class="btn btn-small" onclick="setFPS(60)" style="border-color: gray; color: gray; width: 50%;">60 FPS<br>(PRO)</button>
                </div>
                <p style="font-size: 10px; color: gray; margin-top: 5px;">※手元のプレビューは常に60FPSです</p>
            </div>

            <div class="control-group">
                <h3>MAIN MEDIA</h3>
                <input type="file" id="main-file" accept="video/*,image/*" multiple onchange="handleFiles('main')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="main-file-select" class="file-select" onchange="switchMainMedia()"><option value="">Select File...</option></select>
            </div>
            
            <div class="control-group">
                <h3>WIPE (LEFT BOTTOM)</h3>
                <input type="file" id="wipe-file" accept="video/*,image/*" multiple onchange="handleFiles('wipe')" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="wipe-file-select" class="file-select" onchange="if(this.value!=='') toggleWipe(true)"><option value="">Wipe File...</option></select>
                <div>
                    <button class="btn btn-small" onclick="toggleWipe(true)">SHOW</button>
                    <button class="btn btn-small" onclick="toggleWipe(false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>TEXT & WEATHER (LEFT BOTTOM)</h3>
                <input type="text" id="overlay-text-input" placeholder="TEXT..." style="width: 100%; font-size: 14px; margin-bottom: 5px;">
                <div style="margin-bottom: 5px;">
                    <button class="btn btn-small" onclick="activateInfo('text')">TXT ON</button>
                    <button class="btn btn-small" onclick="activateInfo('weather')">WTH ON</button>
                </div>
                <button class="btn btn-small" onclick="hideInfo()" style="border-color: gray; color: gray; width: 100%;">HIDE TEXT/WTH</button>
            </div>

            <div class="control-group" style="border-color: #9c27b0;">
                <h3 style="color: #9c27b0;">COMING UP NEXT (BOTTOM CENTER)</h3>
                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                    <input type="time" id="schedule-time" style="width: 40%; background: var(--wrc-navy); color: white; border: 1px solid #9c27b0; padding: 5px; font-family: monospace;">
                    <input type="text" id="schedule-text" placeholder="STAGE..." style="width: 60%; background: var(--wrc-navy); color: white; border: 1px solid #9c27b0; padding: 5px;">
                </div>
                <div>
                    <button class="btn btn-small" onclick="toggleSchedule(true)" style="border-color: #9c27b0; color: #9c27b0;">SHOW</button>
                    <button class="btn btn-small" onclick="toggleSchedule(false)" style="border-color: gray; color: gray;">HIDE</button>
                </div>
            </div>

            <div class="control-group" style="border-color: #2196F3;">
                <h3 style="color: #2196F3;">BGM AUDIO</h3>
                <input type="file" id="bgm-file" accept="audio/*, .mp3, .wav, .m4a" multiple onchange="handleAudioFiles()" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
                <select id="bgm-select" class="file-select"><option value="">Select Audio...</option></select>
                <div>
                    <button class="btn btn-small" onclick="playBgm()" style="border-color: #2196F3; color: #2196F3;">PLAY</button>
                    <button class="btn btn-small" onclick="stopBgm()" style="border-color: gray; color: gray;">STOP</button>
                </div>
            </div>
        </div>

        <div id="media-pool">
            <canvas id="stream-canvas" width="1920" height="1080"></canvas>
            
            <video id="main-video" autoplay loop playsinline muted></video>
            <img id="main-img">
            <video id="wipe-video" autoplay loop playsinline muted></video>
            <img id="wipe-img">
            <audio id="bgm-player" loop></audio>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. FPS 制御ロジック
        // ==========================================
        let targetFPS = 24;
        function setFPS(fps) {
            targetFPS = fps;
            if(fps === 24) {
                document.getElementById('fps-24-btn').style.borderColor = '#4CAF50';
                document.getElementById('fps-24-btn').style.color = '#4CAF50';
                document.getElementById('fps-60-btn').style.borderColor = 'gray';
                document.getElementById('fps-60-btn').style.color = 'gray';
            } else {
                document.getElementById('fps-60-btn').style.borderColor = '#4CAF50';
                document.getElementById('fps-60-btn').style.color = '#4CAF50';
                document.getElementById('fps-24-btn').style.borderColor = 'gray';
                document.getElementById('fps-24-btn').style.color = 'gray';
            }
        }

        // ==========================================
        // 1. ファイル＆メディア制御
        // ==========================================
        let mainFiles = [], wipeFiles = [], bgmFiles = [];
        let isMainVideo = false, isWipeVideo = false;

        function resumeAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function handleFiles(type) {
            const input = document.getElementById(`${type}-file`);
            const select = document.getElementById(`${type}-file-select`);
            select.innerHTML = ''; 
            const files = Array.from(input.files);
            if (type === 'main') mainFiles = files; else wipeFiles = files;
            files.forEach((f, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = f.name; select.appendChild(opt); });
            if(files.length > 0) { 
                if(type === 'main') switchMainMedia(); 
                if(type === 'wipe') { switchWipeMedia(); toggleWipe(true); }
            } else { select.innerHTML = '<option value="">Select File...</option>'; }
        }

        function handleAudioFiles() {
            const input = document.getElementById('bgm-file');
            const select = document.getElementById('bgm-select');
            select.innerHTML = ''; bgmFiles = Array.from(input.files);
            bgmFiles.forEach((f, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = f.name; select.appendChild(opt); });
            if(bgmFiles.length === 0) select.innerHTML = '<option value="">Select Audio...</option>';
        }

        function switchMainMedia() {
            resumeAudio();
            const select = document.getElementById('main-file-select');
            if(select.value === "") return;
            const file = mainFiles[select.value];
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                isMainVideo = true; 
                const v = document.getElementById('main-video'); 
                v.muted = false; 
                v.src = url; 
                v.play().catch(e=>console.warn(e));
            } else { isMainVideo = false; document.getElementById('main-img').src = url; }
        }

        function switchWipeMedia() {
            resumeAudio();
            const select = document.getElementById('wipe-file-select');
            if(select.value === "") return;
            const file = wipeFiles[select.value];
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                isWipeVideo = true; 
                const v = document.getElementById('wipe-video'); 
                v.muted = false; 
                v.src = url; 
                v.play().catch(e=>console.warn(e));
            } else { isWipeVideo = false; document.getElementById('wipe-img').src = url; }
        }

        function playBgm() {
            resumeAudio();
            const select = document.getElementById('bgm-select');
            if (select.value === "") return;
            const player = document.getElementById('bgm-player');
            player.src = URL.createObjectURL(bgmFiles[select.value]);
            player.play().catch(e=>console.warn(e));
        }
        function stopBgm() { const p = document.getElementById('bgm-player'); p.pause(); p.currentTime = 0; }

        // ==========================================
        // 2. バックグラウンド天気取得
        // ==========================================
        let weatherData = { cond: '--', temp: '--', wind: '-- / --' };
        function fetchWeatherInBackground() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`);
                    const cw = (await res.json()).current_weather;
                    const c = cw.weathercode;
                    let condStr = 'STORM';
                    if(c===0) condStr='CLEAR'; else if(c<=3) condStr='CLOUDY'; else if(c<=48) condStr='FOG'; else if(c<=67) condStr='RAIN'; else if(c<=77) condStr='SNOW';
                    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
                    const dir = dirs[Math.round(cw.winddirection/45)%8];
                    weatherData = { cond: condStr, temp: `${cw.temperature} °C`, wind: `${dir} / ${cw.windspeed} km/h` };
                } catch(e) {}
            }, () => {}, { timeout: 10000 });
        }
        setInterval(fetchWeatherInBackground, 60000);

        // ==========================================
        // 3. デュアル・キャンバス描画エンジン
        // ==========================================
        // プレビュー用 (常に60FPS)
        const canvas = document.getElementById('composite-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // P2P送信用 (targetFPSで制限)
        const streamCanvas = document.getElementById('stream-canvas');
        const streamCtx = streamCanvas.getContext('2d', { alpha: false });

        let wipeState = { status: 'HIDDEN', progress: 0 };
        let infoState = { active: null, next: null, status: 'HIDDEN', progress: 0 }; 
        let scheduleState = { status: 'HIDDEN', progress: 0, time: '', text: '' };

        function toggleWipe(show) {
            if(show && wipeState.status === 'HIDDEN') { wipeState.status = 'IN'; wipeState.progress = 0; }
            else if(!show && wipeState.status === 'VISIBLE') { wipeState.status = 'OUT'; wipeState.progress = 1; }
        }

        function activateInfo(type) {
            if(infoState.status === 'HIDDEN') {
                infoState.active = type; infoState.status = 'IN'; infoState.progress = 0;
            } else if(infoState.status === 'VISIBLE' && infoState.active !== type) {
                infoState.next = type; infoState.status = 'OUT'; infoState.progress = 1.0;
            }
        }
        function hideInfo() {
            if(infoState.status === 'VISIBLE') { infoState.next = null; infoState.status = 'OUT'; infoState.progress = 1.0; }
        }

        function toggleSchedule(show) {
            if(show && scheduleState.status === 'HIDDEN') {
                scheduleState.time = document.getElementById('schedule-time').value || "00:00";
                scheduleState.text = document.getElementById('schedule-text').value || "NEXT STAGE";
                scheduleState.status = 'IN'; scheduleState.progress = 0;
            } else if(!show && scheduleState.status === 'VISIBLE') {
                scheduleState.status = 'OUT'; scheduleState.progress = 1;
            }
